
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d17">
<title>LUCK LOOP - オフラインスロット</title>
<style>
:root{color-scheme:dark;--bg:#0b0d17;--panel:#171b2b;--line:#30364b;--lime:#bcff55;--yellow:#ffdb65;--pink:#ff4fa0;--white:#f7f8ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--white);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
body{background:radial-gradient(ellipse at 50% -10%,#29234b 0%,#0b0d17 58%);overscroll-behavior:none}
button{font:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid white;outline-offset:3px}
.app{max-width:430px;min-height:100dvh;margin:auto;padding:calc(15px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:17px}
.header,.flex{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{font-size:24px;font-weight:1000;letter-spacing:-1.3px}
.logo em{font-style:normal;color:var(--lime)}
.sub{font-size:10px;letter-spacing:2.4px;color:#999fb6;font-weight:900}
.iconBtn{background:#252a3b;border:1px solid #3c4254;color:white;border-radius:14px;min-width:45px;height:43px;font-size:19px}
.topline{display:flex;align-items:end;justify-content:space-between}
.round{color:var(--lime);font-size:14px;font-weight:900;letter-spacing:2px}
.best{font-size:11px;color:#9ba2bc}
.goal{background:#191d30;border:1px solid #30364c;border-radius:18px;padding:16px;box-shadow:0 8px 25px #0002}
.goal small{font-size:12px;color:#b7bed3;font-weight:800}
.goal strong{font-size:27px;font-weight:1000;font-variant-numeric:tabular-nums}
.bar{height:13px;background:#34394e;border-radius:100px;overflow:hidden;margin:14px 0 11px}
.bar>div{height:100%;width:0%;border-radius:inherit;background:linear-gradient(90deg,#72e6a0,var(--lime));transition:width .35s;box-shadow:0 0 22px #bcff5566}
.metrics{font-size:12px;color:#b6bbd0;font-weight:800;font-variant-numeric:tabular-nums}
.metrics b{color:white}
.machine{position:relative;isolation:isolate;border:2px solid #555171;border-radius:25px;background:linear-gradient(155deg,#30334b,#171a2a 45%,#24233d);padding:17px 12px 15px;box-shadow:0 13px 0 #0d0d17,0 21px 35px #0007,inset 0 1px #ffffff4d}
.machine:before{content:"";position:absolute;inset:7px;border:1px solid #ffffff12;border-radius:18px;pointer-events:none}
.machine-top{text-align:center;color:#ffe583;font-size:11px;font-weight:1000;letter-spacing:3px;padding-bottom:14px;text-shadow:0 0 15px #ffda6699}
.reels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.reel{height:120px;border-radius:12px;background:linear-gradient(#ffffff,#e8eaf3 43%,#ffffff);border:3px solid #b9c1d0;box-shadow:inset 0 0 24px #7785a37a,0 3px 0 #111325;display:grid;place-items:center;color:#1d263a;font-size:clamp(43px,14vw,62px);font-weight:1000;letter-spacing:-5px;overflow:hidden;user-select:none;line-height:1}
.reel.rolling{animation:jitter .11s linear infinite;filter:blur(1.2px)}
@keyframes jitter{0%{transform:translateY(-3px)}50%{transform:translateY(3px)}100%{transform:translateY(-3px)}}
.reel.matched{background:#fff6c7;box-shadow:inset 0 0 25px #ffc44f,0 0 19px #ffe55d88;border-color:#fff4a3}
.message{height:53px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:1000;text-align:center;color:#cbd1e3;letter-spacing:.5px}
.message.win{color:var(--lime);text-shadow:0 0 17px #caff6e80}
.message.big{color:var(--yellow);text-shadow:0 0 18px #ffd04e}
.spin{display:block;width:100%;height:79px;border:0;border-radius:20px;color:#151422;background:linear-gradient(135deg,#d2ff66,#8aff7f);font-size:28px;font-weight:1000;letter-spacing:3px;box-shadow:0 7px 0 #40884a,0 13px 25px #0007;transition:transform .09s,box-shadow .09s}
.spin:active:not(:disabled){transform:translateY(5px);box-shadow:0 2px 0 #40884a}
.spin:disabled{opacity:.55;filter:grayscale(.6);cursor:default}
.hint{text-align:center;font-size:11px;color:#a3aabd;line-height:1.65;margin:1px 0}
.powers{background:#171b29;border:1px solid #292e40;border-radius:16px;padding:13px;min-height:61px}
.powers b{font-size:12px;color:#d4d8e6}
.powers div{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:11px;font-weight:800;color:#dbebfe;border-radius:8px;background:#2e344a;padding:5px 7px}
.bottom{display:flex;align-items:center;justify-content:space-between;font-size:10px;color:#828ba5;margin-top:auto}
.reset{border:0;background:none;color:#999fb4;font-size:11px;text-decoration:underline;padding:8px}
.flash{pointer-events:none;position:fixed;inset:0;z-index:10;opacity:0;background:#fff2a7;transition:opacity .2s}
.flash.on{opacity:.34;transition:none}
.jackpot{position:fixed;z-index:11;pointer-events:none;left:0;right:0;top:39%;text-align:center;font-weight:1000;font-size:clamp(39px,12vw,67px);letter-spacing:-3px;color:#fff9aa;text-shadow:0 5px #de397c,0 0 35px #ff459b;animation:pop 1s both}
@keyframes pop{0%{opacity:0;transform:scale(.25) rotate(-12deg)}18%{opacity:1;transform:scale(1.15) rotate(3deg)}32%{transform:scale(1)}83%{opacity:1}100%{opacity:0;transform:scale(1.25)}}
.particle{position:fixed;pointer-events:none;top:-7vh;z-index:12;width:9px;height:14px;background:var(--color);left:var(--x);animation:fall var(--duration) ease-in both;animation-delay:var(--delay)}
@keyframes fall{to{transform:translate(var(--dx),112vh) rotate(850deg);opacity:.5}}
.overlay{position:fixed;z-index:20;inset:0;background:#060711dd;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
.overlay.hidden{display:none}
.dialog{width:min(100%,400px);background:linear-gradient(160deg,#292e48,#151927);border:1px solid #515b78;border-radius:25px;padding:24px 18px 20px;text-align:center;box-shadow:0 20px 80px #000a;max-height:90dvh;overflow:auto}
.dialog h1{margin:7px 0;font-size:34px;letter-spacing:1px;color:var(--lime)}
.dialog p{font-size:13px;color:#bbc4d9;line-height:1.7;margin:6px 0 18px}
.upgrade{width:100%;border:1px solid #565f80;background:#272f47;color:#fff;border-radius:15px;display:flex;align-items:center;text-align:left;gap:12px;padding:14px 12px;margin:9px 0}
.upgrade:active{background:#495478;transform:scale(.99)}
.upgrade .emoji{font-size:32px;min-width:38px;text-align:center}
.upgrade strong{display:block;font-size:16px}
.upgrade small{display:block;margin-top:4px;color:#bdc6dc;font-size:12px}
.primary{width:100%;border:0;border-radius:16px;padding:16px;background:var(--lime);color:#101821;font-size:18px;font-weight:1000;margin-top:4px}
@media (max-height:750px){.app{gap:12px}.reel{height:94px}.spin{height:66px}.goal{padding:13px}.machine{padding:13px 10px}.message{height:42px}}
@media (prefers-reduced-motion:reduce){.reel.rolling,.particle,.jackpot{animation:none}.bar>div{transition:none}}
</style>
</head>
<body>
<main class="app">
  <header class="header">
    <div>
      <div class="logo">LUCK <em>LOOP</em></div>
      <div class="sub">ONE TAP SLOT GAME</div>
    </div>
    <button class="iconBtn" id="sound" aria-label="サウンド切り替え">🔊</button>
  </header>
  <div class="topline">
    <div class="round" id="round">ROUND 01</div>
    <div class="best" id="best">BEST ROUND 01</div>
  </div>
  <section class="goal">
    <div class="flex">
      <small>返済ノルマ</small>
      <strong id="target">190</strong>
    </div>
    <div class="bar"><div id="bar"></div></div>
    <div class="flex metrics">
      <span>獲得 <b id="bank">0</b></span>
      <span>残り <b id="turns">8</b> 回</span>
    </div>
  </section>
  <section class="machine">
    <div class="machine-top">✦　LUCKY REELS　✦</div>
    <div class="reels" id="reels">
      <div class="reel">🍒</div>
      <div class="reel">🍀</div>
      <div class="reel">7️⃣</div>
    </div>
    <div class="message" id="message" aria-live="polite">同じ絵柄をそろえよう！</div>
  </section>
  <button class="spin" id="spin">SPIN !</button>
  <p class="hint">
    2つそろうと当たり・3つそろうと大当たり<br>
    8回以内にノルマ達成！ クリアで能力を強化
  </p>
  <section class="powers">
    <b>⚡ 強化アイテム</b>
    <div id="powers"><span class="chip">まだなし</span></div>
  </section>
  <footer class="bottom">
    <span>オフライン対応・課金なし・自動セーブ</span>
    <button class="reset" id="reset">最初から</button>
  </footer>
</main>

<div class="flash" id="flash"></div>
<div class="overlay hidden" id="overlay">
  <div class="dialog" id="dialog"></div>
</div>

<script>
(()=>{
  'use strict';

  const $=id=>document.getElementById(id);
  const faces=['🍒','🍋','🍀','🔔','💎','7️⃣'];
  const weights=[30,27,21,13,7,2];
  const pairPay=[32,40,54,76,125,280];
  const triplePay=[170,210,270,390,640,2000];
  const reelEls=[...document.querySelectorAll('.reel')];
  const KEY='luck_loop_v1';

  const itemDefs=[
    {id:'all',icon:'🚀',name:'全当たり強化',desc:'すべての当たり +35%',max:99},
    {id:'pair',icon:'🍒',name:'ペア強化',desc:'2つそろいの獲得 +70%',max:99},
    {id:'triple',icon:'💎',name:'トリプル強化',desc:'3つそろいの獲得 +90%',max:99},
    {id:'turn',icon:'⏳',name:'追加スピン',desc:'毎ラウンドの回転数 +1',max:5},
    {id:'bonus',icon:'🪙',name:'おまけコイン',desc:'当たるたび +35 コイン',max:99},
    {id:'wild',icon:'🍀',name:'幸運のお守り',desc:'ペアを3つそろいに変える確率 +12%',max:6}
  ];

  const fresh=()=>({
    stage:1,spins:8,bank:0,total:0,
    best:1,streak:0,power:{},last:[0,2,5]
  });

  let state=fresh(),busy=false,audio=null,soundOn=true;

  try{
    const raw=JSON.parse(localStorage.getItem(KEY));
    if(raw&&Number.isInteger(raw.stage)&&raw.stage>=1&&raw.stage<=10000&&Number.isFinite(raw.bank)&&Number.isFinite(raw.spins)&&raw.power&&typeof raw.power==='object'){
      state={...fresh(),...raw,power:{...raw.power}};
      state.spins=Math.max(0,Math.min(20,state.spins));
    }
    soundOn=localStorage.getItem('luck_loop_sound')!=='off';
  }catch(e){}

  const save=()=>{
    try{localStorage.setItem(KEY,JSON.stringify(state));}
    catch(e){}
  };

  const goal=()=>Math.round(190*Math.pow(1.39,state.stage-1)/10)*10;
  const maxSpins=()=>8+(state.power.turn||0);

  const pick=()=>{
    let r=Math.random()*100;
    for(let i=0;i<weights.length;i++){
      r-=weights[i];
      if(r<0)return i;
    }
    return 0;
  };

  const level=id=>state.power[id]||0;

  function render(){
    $('round').textContent='ROUND '+String(state.stage).padStart(2,'0');
    $('best').textContent='BEST ROUND '+String(Math.max(state.best,state.stage)).padStart(2,'0');
    $('target').textContent=goal().toLocaleString('ja-JP');
    $('bank').textContent=Math.round(state.bank).toLocaleString('ja-JP')+' / '+goal().toLocaleString('ja-JP');
    $('turns').textContent=state.spins;
    $('bar').style.width=Math.min(100,100*state.bank/goal())+'%';
    $('spin').disabled=busy||state.spins<=0;

    const tags=itemDefs
      .filter(x=>level(x.id)>0)
      .map(x=>'<span class="chip">'+x.icon+' '+x.name+' Lv.'+level(x.id)+'</span>');

    $('powers').innerHTML=tags.join('')||'<span class="chip">まだなし</span>';

    if(Array.isArray(state.last)&&state.last.length===3){
      state.last.forEach((v,i)=>{
        if(!busy)reelEls[i].textContent=faces[v]||faces[0];
      });
    }
    $('sound').textContent=soundOn?'🔊':'🔇';
  }

  function sound(freq=440,dur=.1,type='sine',volume=.08,delay=0){
    if(!soundOn)return;
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return;

      audio=audio||new AC();

      if(audio.state==='suspended'){
        audio.resume().catch(()=>{});
      }

      let o=audio.createOscillator();
      let g=audio.createGain();
      let t=audio.currentTime+delay;

      o.type=type;
      o.frequency.setValueAtTime(freq,t);
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(Math.max(.001,volume),t+.015);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);

      o.connect(g);
      g.connect(audio.destination);
      o.start(t);
      o.stop(t+dur+.015);
    }catch(e){}
  }

  const buzz=pattern=>{
    try{navigator.vibrate?.(pattern);}
    catch(e){}
  };

  const tick=()=>sound(240,.042,'square',.026);

  function melody(big){
    const notes=big
      ?[523,659,784,988,1175,1568]
      :[523,659,784];

    notes.forEach((n,i)=>
      sound(n,.21,big?'sawtooth':'triangle',big?.065:.055,i*.095)
    );

    if(big){
      sound(130,.4,'sine',.12,.03);
      buzz([70,35,90,35,150]);
    }else{
      buzz([40,40,60]);
    }
  }

  function sparkle(count=36){
    const colors=['#bcff55','#ffe16a','#ff4fa0','#7edcff','#fff'];

    for(let i=0;i<count;i++){
      let d=document.createElement('i');
      d.className='particle';

      d.style.cssText=`
        --x:${Math.random()*100}vw;
        --dx:${(Math.random()-.5)*180}px;
        --color:${colors[i%colors.length]};
        --duration:${1.1+Math.random()*.7}s;
        --delay:${Math.random()*.22}s
      `;

      document.body.appendChild(d);
      setTimeout(()=>d.remove(),2200);
    }
  }

  function burst(word){
    const f=$('flash');
    f.classList.add('on');

    setTimeout(()=>f.classList.remove('on'),80);

    const t=document.createElement('div');
    t.className='jackpot';
    t.textContent=word;

    document.body.appendChild(t);
    setTimeout(()=>t.remove(),1100);
  }

  function buildResult(){
    let arr=[pick(),pick(),pick()];
    let counts=arr.map(x=>arr.filter(y=>x===y).length);

    if(Math.max(...counts)===2&&Math.random()<Math.min(.72,level('wild')*.12)){
      let index=counts.findIndex(x=>x===1);
      let other=counts.findIndex(x=>x===2);

      arr[index]=arr[other];
      counts=[3,3,3];
    }

    let amount=0;
    let match=0;
    let matchFace=-1;

    if(arr[0]===arr[1]&&arr[1]===arr[2]){
      match=3;
      matchFace=arr[0];
      amount=triplePay[matchFace]*(1+level('triple')*.9);
    }else{
      let same=
        arr[0]===arr[1]?arr[0]:
        arr[1]===arr[2]?arr[1]:
        arr[0]===arr[2]?arr[0]:-1;

      if(same>=0){
        match=2;
        matchFace=same;
        amount=pairPay[same]*(1+level('pair')*.7);
      }
    }

    if(match){
      amount=Math.round(
        amount*
        (1+level('all')*.35)*
        (1+Math.min(5,state.streak)*.12)
        +level('bonus')*35
      );
    }

    return {arr,amount,match,matchFace};
  }

  function finishSpin(result){
    state.last=result.arr;
    state.bank+=result.amount;
    state.total+=result.amount;

    reelEls.forEach(e=>e.classList.remove('matched'));

    const m=$('message');
    m.className='message';

    if(result.match){
      state.streak++;

      reelEls.forEach((e,i)=>{
        if(result.arr[i]===result.matchFace){
          e.classList.add('matched');
        }
      });

      m.textContent=
        (result.match===3?'大当たり！ ':'当たり！ ')+
        '+'+result.amount.toLocaleString('ja-JP');

      m.classList.add(result.match===3?'big':'win');
      melody(result.match===3);

      if(result.match===3){
        burst(result.matchFace===5?'MEGA JACKPOT!':'JACKPOT!');
        sparkle(result.matchFace===5?85:48);
      }
    }else{
      state.streak=0;
      m.textContent='ざんねん！ 次こそ！';
      sound(195,.14,'sine',.035);
    }

    state.best=Math.max(state.best,state.stage);
    busy=false;

    save();
    render();

    if(state.spins===0){
      setTimeout(()=>endRound(),950);
    }
  }

  function spin(){
    if(busy||state.spins<=0)return;

    busy=true;
    state.spins--;

    reelEls.forEach(e=>e.classList.remove('matched'));

    const msg=$('message');
    msg.textContent='回転中…';
    msg.className='message';

    $('spin').disabled=true;

    buzz(20);
    sound(140,.15,'sawtooth',.065);

    const result=buildResult();
    const done=[false,false,false];
    const ends=[560,830,1100];

    reelEls.forEach(e=>e.classList.add('rolling'));

    const timer=setInterval(()=>{
      reelEls.forEach((e,i)=>{
        if(!done[i])e.textContent=faces[pick()];
      });
    },75);

    ends.forEach((ms,i)=>setTimeout(()=>{
      done[i]=true;
      reelEls[i].classList.remove('rolling');
      reelEls[i].textContent=faces[result.arr[i]];

      tick();
      buzz(15);

      if(i===2){
        clearInterval(timer);
        setTimeout(()=>finishSpin(result),160);
      }
    },ms));

    render();
  }

  function endRound(){
    if(state.spins!==0||busy)return;

    const won=state.bank>=goal();
    let dialog=$('dialog');

    if(won){
      sparkle(28);
      melody(true);

      const options=[...itemDefs]
        .filter(x=>level(x.id)<x.max)
        .sort(()=>Math.random()-.5)
        .slice(0,3);

      dialog.innerHTML=`
        <div class="sub">DEBT CLEARED!</div>
        <h1>返済成功！</h1>
        <p>
          ROUND ${state.stage} クリア！<br>
          好きな強化を1つ選んで次のラウンドへ
        </p>
        <div id="choices"></div>
      `;

      const box=$('choices');

      options.forEach(item=>{
        let b=document.createElement('button');
        b.className='upgrade';

        b.innerHTML=`
          <span class="emoji">${item.icon}</span>
          <span>
            <strong>${item.name}</strong>
            <small>${item.desc}　（Lv.${level(item.id)+1}）</small>
          </span>
        `;

        b.onclick=()=>{
          state.power[item.id]=level(item.id)+1;
          state.stage++;
          state.bank=0;
          state.spins=maxSpins();
          state.streak=0;
          state.best=Math.max(state.best,state.stage);

          $('overlay').classList.add('hidden');
          $('message').textContent='強化完了！ 次のノルマへ！';
          $('message').className='message';

          reelEls.forEach(e=>e.classList.remove('matched'));

          save();
          render();
          sound(880,.2,'triangle',.08);
        };

        box.appendChild(b);
      });

    }else{
      sound(180,.44,'triangle',.085);

      dialog.innerHTML=`
        <div class="sub">GAME OVER</div>
        <h1 style="color:#ff86b1">返済失敗…</h1>
        <p>
          ROUND ${state.stage} まで到達<br>
          総獲得 ${state.total.toLocaleString('ja-JP')} コイン<br>
          あと ${(goal()-state.bank).toLocaleString('ja-JP')} コインだった！
        </p>
        <button class="primary" id="again">もう一度挑戦</button>
      `;

      $('again').onclick=()=>{
        let oldBest=state.best;
        state=fresh();
        state.best=oldBest;

        save();

        $('overlay').classList.add('hidden');
        $('message').textContent='同じ絵柄をそろえよう！';
        $('message').className='message';

        reelEls.forEach(e=>e.classList.remove('matched'));
        render();
      };
    }

    $('overlay').classList.remove('hidden');
  }

  $('spin').addEventListener('click',spin);

  $('sound').addEventListener('click',()=>{
    soundOn=!soundOn;

    try{
      localStorage.setItem('luck_loop_sound',soundOn?'on':'off');
    }catch(e){}

    render();

    if(soundOn){
      sound(700,.12,'sine',.07);
    }
  });

  $('reset').addEventListener('click',()=>{
    if(busy)return;

    if(confirm('最初のラウンドからやり直す？（最高記録は残ります）')){
      let best=state.best;
      state=fresh();
      state.best=best;

      save();

      $('overlay').classList.add('hidden');
      $('message').textContent='同じ絵柄をそろえよう！';
      $('message').className='message';

      reelEls.forEach(e=>e.classList.remove('matched'));
      render();
    }
  });

  render();

  if(state.spins===0){
    setTimeout(endRound,100);
  }
})();
</script>
</body>
</html>
