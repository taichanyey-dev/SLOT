<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1020">
<title>LUCK LOOP — ROGUE CHAIN</title>
<style>
:root{color-scheme:dark;--bg:#0c1020;--panel:#171e32;--line:#394363;--mint:#b9ff77;--gold:#ffda70;--muted:#aab5cc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:#f5f7ff;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
body{background:radial-gradient(ellipse at top,#31274b 0%,#0c1020 62%);overscroll-behavior:none}
button{font:inherit;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45;cursor:default}button:focus-visible{outline:2px solid white;outline-offset:3px}
.app{width:min(100%,450px);min-height:100dvh;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.top,.between{display:flex;align-items:center;justify-content:space-between;gap:9px}.brand{font-size:26px;font-weight:1000;letter-spacing:-1.6px;line-height:1}.brand b{color:var(--mint)}.eyebrow{font-size:10px;color:var(--muted);letter-spacing:1.4px;font-weight:850;margin-top:5px}.tiny{font-size:11px;color:var(--muted)}.tools{display:flex;gap:5px}.tool{height:37px;border-radius:11px;background:#263049;border:1px solid #495473;color:#e7ebfa;font-weight:900;font-size:12px;padding:0 10px}
.stats{background:linear-gradient(135deg,#222a44,#151a2b);border:1px solid var(--line);border-radius:17px;padding:13px 14px}.score{font-size:clamp(30px,9vw,43px);font-weight:1000;letter-spacing:-1.4px;font-variant-numeric:tabular-nums;line-height:1.15;overflow-wrap:anywhere}.floor{font-size:14px;color:var(--mint);font-weight:1000}.bar{height:8px;border-radius:20px;background:#37415c;margin-top:9px;overflow:hidden}.bar div{height:100%;width:0;background:linear-gradient(90deg,#62cca8,var(--mint));border-radius:inherit;transition:width .2s}.stats-bottom{margin-top:6px;font-size:11px;color:#b6c3da;font-weight:750}.boss{background:linear-gradient(90deg,#392032,#1c1e35);border:1px solid #865169;border-radius:13px;padding:10px 12px}.boss.hidden{display:none}.boss strong{font-size:12px;color:#ffb4bf}.bossbar{background:#392937;border-radius:20px;height:9px;margin-top:7px;overflow:hidden}.bossbar div{height:100%;background:linear-gradient(90deg,#ee5f89,#ffc17e);width:100%;transition:width .3s}
.machine{border:2px solid #555575;border-radius:21px;padding:11px;background:linear-gradient(150deg,#30344d,#171c2c 65%,#302a44);box-shadow:0 7px #090b13,0 13px 25px #0007;position:relative;isolation:isolate}.machinehead{text-align:center;font-size:11px;letter-spacing:2.4px;color:var(--gold);font-weight:1000;padding:0 0 10px}.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.cell{position:relative;min-width:0;aspect-ratio:1;background:linear-gradient(#fff,#e1e8f2 48%,#fff);border:2px solid #c5ccdb;border-radius:11px;display:grid;place-items:center;color:#182035;box-shadow:inset 0 0 11px #92a4c6;font-size:clamp(29px,9vw,46px);user-select:none;transition:transform .15s,opacity .15s}.cell .symbol{line-height:1}.cell .stamp{position:absolute;right:1px;bottom:1px;font-size:clamp(12px,3.4vw,18px);filter:drop-shadow(0 1px 1px #0008);z-index:2}.cell.special{border-color:#e4bc74}.cell.wild{background:linear-gradient(#edfcff,#b0ebef)}.cell.hit{transform:scale(1.07);z-index:2;background:#fff0a2;border-color:#fffbc8;box-shadow:0 0 22px #ffdb57,inset 0 0 12px #f9b847}.cell.gone{transform:scale(.2) rotate(14deg);opacity:0}.cell.falling{animation:drop .32s cubic-bezier(.1,.8,.4,1.2)}.cell.roll{animation:roll .13s linear infinite}
@keyframes roll{0%,100%{transform:translateY(-3px);filter:blur(1px)}50%{transform:translateY(3px);filter:blur(1px)}}@keyframes drop{0%{transform:translateY(-32px);opacity:.3}70%{transform:translateY(3px);opacity:1}100%{transform:translateY(0)}}
.message{text-align:center;height:39px;display:flex;align-items:center;justify-content:center;color:#d7def0;font-size:14px;font-weight:950}.message.hot{color:var(--gold);text-shadow:0 0 16px #ffdc7d}.spin{width:100%;height:72px;border:none;border-radius:18px;background:linear-gradient(135deg,#dfff80,#87f3a7);color:#16201a;font-size:28px;font-weight:1000;letter-spacing:3px;box-shadow:0 6px #367f52,0 13px 20px #0007}.spin:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px #367f52}.spin:disabled{filter:grayscale(.5)}.hint{margin:0;text-align:center;font-size:11px;color:#adb9d1;line-height:1.5}
.bag{border:1px solid #303953;background:#171d30;border-radius:14px;padding:11px}.bag summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:900}.bag summary::-webkit-details-marker{display:none}.pills{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}.pill{font-size:11px;background:#303950;border-radius:7px;padding:6px 8px}.fusions{font-size:11px;color:var(--gold);line-height:1.7;margin-top:9px}.foot{margin-top:auto;color:#8995ae;display:flex;justify-content:space-between;align-items:center;font-size:10px}.link{background:none;border:none;text-decoration:underline;color:#aab6cb;padding:7px;font-size:11px}
.float{position:absolute;z-index:7;pointer-events:none;transform:translate(-50%,-50%);font-weight:1000;font-variant-numeric:tabular-nums;font-size:17px;color:#fff7c5;white-space:nowrap;text-shadow:0 2px #9d543a,0 0 13px #f8b853;animation:float .58s ease-out both}@keyframes float{0%{opacity:0;transform:translate(-50%,-10%) scale(.65)}25%{opacity:1;transform:translate(-50%,-62%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-140%)}}
.total{position:absolute;inset:19% 0 16%;z-index:9;pointer-events:none;display:flex;justify-content:center;align-items:center;flex-direction:column;text-align:center;background:radial-gradient(ellipse,#131220ed,#131220ac 57%,transparent 78%);animation:pop 1.1s both}.total small{color:#f6dc97;letter-spacing:2px;font-weight:1000}.total strong{color:#fff0ac;font-size:clamp(35px,10vw,54px);text-shadow:0 3px #b66f4d,0 0 22px #ffcb71;max-width:98%;overflow-wrap:anywhere}.total span{font-size:14px;font-weight:900}@keyframes pop{0%{transform:scale(.5);opacity:0}20%{transform:scale(1.05);opacity:1}80%{opacity:1}100%{transform:scale(1.14);opacity:0}}
.flash{position:fixed;inset:0;background:#fff3bc;z-index:20;opacity:0;pointer-events:none;transition:opacity .18s}.flash.on{opacity:.3;transition:none}.confetti{position:fixed;z-index:21;top:-5vh;left:var(--x);width:8px;height:13px;pointer-events:none;background:var(--c);animation:fall var(--t) linear forwards}@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(780deg);opacity:0}}
.overlay{position:fixed;z-index:50;inset:0;background:#050712e9;display:grid;place-items:center;padding:18px;backdrop-filter:blur(7px)}.overlay.hidden{display:none}.modal{width:min(100%,420px);max-height:92dvh;overflow:auto;border:1px solid #596582;background:linear-gradient(150deg,#2d354e,#151a2c);border-radius:23px;padding:20px 16px;text-align:center;box-shadow:0 25px 75px #000c}.modal h2{font-size:27px;color:var(--mint);margin:5px 0}.modal p{font-size:12px;line-height:1.65;color:#c5cee1;margin:7px 0 15px}.choice{width:100%;background:#2a3450;border:1px solid #56637e;color:white;border-radius:14px;padding:13px 12px;display:flex;align-items:center;gap:12px;text-align:left;margin:8px 0}.choice:active{background:#455574}.choice .emoji{font-size:27px;flex:0 0 36px;text-align:center}.choice strong{display:block;font-size:15px}.choice small{display:block;font-size:11px;line-height:1.5;color:#c9d1e3;margin-top:4px}.choice .tag{font-size:10px;color:#ffdc7f;font-weight:1000}.primary{width:100%;border:0;border-radius:14px;background:var(--mint);color:#172018;font-weight:1000;font-size:17px;padding:15px}.notice{color:var(--gold);font-weight:900;font-size:12px}
@media(max-height:760px){.app{gap:9px}.stats{padding:10px}.machine{padding:9px}.machinehead{padding-bottom:7px}.message{height:33px}.spin{height:63px}.board{gap:5px}}@media(prefers-reduced-motion:reduce){.cell.roll,.cell.falling,.total,.float,.confetti{animation:none!important}.cell{transition:none!important}}
</style>
</head>
<body>
<main class="app">
 <header class="top"><div><div class="brand">LUCK <b>LOOP</b></div><div class="eyebrow">ROGUE CHAIN · BALANCED</div></div><div class="tools"><button class="tool" id="speed">通常</button><button class="tool" id="audio">🔊</button></div></header>
 <section class="stats"><div class="between"><div><div class="eyebrow">TOTAL SCORE</div><div class="score" id="score">0</div></div><div style="text-align:right"><div class="floor" id="floor">FLOOR 1 / 10</div><div class="tiny" id="spins">0 / 100 SPINS</div></div></div><div class="bar"><div id="barfill"></div></div><div class="between stats-bottom"><span id="floorDesc">10回転で次の階へ</span><span id="best">BEST 0</span></div></section>
 <section class="boss hidden" id="boss"><div class="between"><strong id="bossName">👹 ボス</strong><strong id="bossHp">HP 0</strong></div><div class="bossbar"><div id="bossFill"></div></div></section>
 <section class="machine" id="machine"><div class="machinehead">✦ CHAIN REACTION ✦</div><div class="board" id="board"></div><div id="message" class="message">SPINで連鎖を起こせ！</div></section>
 <button class="spin" id="spin">SPIN !</button>
 <p class="hint">縦・横・斜め3個で消える → 落ちる → また連鎖！<br>10回転ごとにギミックを1つ獲得</p>
 <details class="bag"><summary><span>✨ 所持ギミック <span id="ownedCount">0</span>種類</span><span>見る ▾</span></summary><div class="pills" id="owned"></div><div class="fusions" id="fusions"></div></details>
 <footer class="foot"><span>オフライン・自動セーブ</span><button class="link" id="reset">最初から</button></footer>
</main>
<div id="flash" class="flash"></div>
<div id="overlay" class="overlay hidden"><div class="modal" id="dialog"></div></div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const ICON=['🍒','🍋','🍀','🔔','💎','7️⃣'];
const BASE=[42,49,59,72,98,140];
const CAP=999999999999;
const KEY='luckloop_rogue_chain_balanced_v3';
const DIR=[[0,1],[1,0],[1,1],[1,-1]];
// id, icon, name, effect, max level, unlock floor
const CARDS=[
[0,'💣','爆弾','爆弾マスが出現。そろうと周囲8マスを爆破',2,1],
[1,'🧨','誘爆','爆風が別の爆弾に触れると次々爆発',1,2],
[2,'⚡','雷玉','雷玉がそろうと同じ絵柄を盤面から全消去',2,1],
[3,'🦠','増殖スライム','当たったスライムが隣2マスを同じ絵柄に変化',2,1],
[4,'🧊','氷結','氷マスは当たっても1回だけ盤面に残る',2,1],
[5,'🪞','ミラー','新しい絵柄が確率で左隣をコピー',2,1],
[6,'🧲','磁石','落下後、横に同じ絵柄が並ぶように整列',2,1],
[7,'🎨','ペイント','当たりの周囲2マスを同じ絵柄に塗り替え',2,1],
[8,'🧬','分裂','消えた絵柄のコピー2個を次の落下で生成',2,2],
[9,'🪃','ブーメラン','消えた絵柄が次の落下で戻りやすくなる',2,1],
[10,'👻','ゴースト','当たった幽霊マスが万能マスに変化して残る',2,1],
[11,'🌪️','竜巻','回転開始時、当たりが増える列入れ替えを探す',1,1],
[12,'🧨','時限爆弾','3連鎖目に縦1列を爆破',1,3],
[13,'🎁','宝箱','宝箱マスを消すと次の落下に万能2マス',2,1],
[14,'🌱','種まき','2連鎖目以降、隣1マスをコピーする',2,1],
[15,'☄️','隕石','4回転に1回、縦1列を引き直し有利な方を採用',1,1],
[16,'🔥','炎','2連鎖目以降、当たりの周りも最大4マス燃やす',1,2],
[17,'💎','結晶','落下後、同じ絵柄を縦に寄せる',2,2],
[18,'🕳️','ワープ','開始時に2マスを交換し当たりを増やす',1,1],
[19,'👑','王冠','王冠が消えると同じ絵柄3マスが万能に',2,3],
[20,'🌟','ワイルド','万能絵柄が出現。どの絵柄にもつながる',2,1],
[21,'♾️','再生','最初にハズレたら6マスを引き直す',1,1],
[22,'🌈','虹の奇跡','8回転に1回、ランダムな5マスを同じ絵柄に',1,1],
[23,'✨','黄金','黄金マスが出現。そろうと追加得点',2,1],
[24,'🔊','エコー','2連鎖目から直前の当たり絵柄が落ちやすい',2,2],
[25,'💥','ラインブレイカー','4連鎖目に横1行を吹き飛ばす',1,3],
[26,'🔮','未来視','毎回2つの初期盤面から当たりが多い方を選ぶ',1,3],
[27,'🗿','トーテム','次の落下で直前にそろった絵柄が出やすい',2,2],
[28,'🐉','ドラゴン','5連鎖目に横2行を焼き払う',1,4],
[29,'⚗️','反応炉','特殊マス2種類発動で次の落下に万能2マス',1,3]
];
const COMBOS=[
 {a:0,b:2,name:'🌩️ 雷撃爆弾',desc:'爆弾の爆風で同じ絵柄を全消去'},
 {a:3,b:2,name:'⚡ 感染雷撃',desc:'スライムと雷玉が共鳴して変異が拡大'},
 {a:6,b:17,name:'🧲 結晶磁界',desc:'落下後に追加でもう1マス整列'},
 {a:7,b:16,name:'🔥 炎のペイント',desc:'塗り替えた周囲も燃焼'},
 {a:19,b:20,name:'👑 虹の王冠',desc:'王冠の万能化が3→5マスに増加'},
 {a:14,b:28,name:'🐉 世界樹ドラゴン',desc:'ドラゴンが4連鎖目から覚醒'}
];
function fresh(best=0){return{started:false,spins:0,score:0,best,cards:{},pending:1,boss:null,bossWins:[],maxChain:0,maxTurn:0,history:[],board:null};}
let st=fresh(),board=[],cell=[],busy=false,fast=false,mute=false,audio=null;
try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&Number.isInteger(v.spins)&&v.spins>=0&&v.spins<=100&&v.cards&&typeof v.cards==='object'&&Number.isFinite(v.score)){st={...fresh(),...v};}fast=localStorage.getItem(KEY+'_fast')==='1';mute=localStorage.getItem(KEY+'_mute')==='1';}catch(e){}
const lv=id=>Math.max(0,Math.min(CARDS[id][4],Number(st.cards[id]||0)));
const have=id=>lv(id)>0;
const combo=(a,b)=>have(a)&&have(b);
const rnd=n=>Math.floor(Math.random()*n);
const fmt=n=>Math.floor(Math.max(0,n)).toLocaleString('ja-JP');
const cap=n=>Math.max(0,Math.min(CAP,Math.round(Number.isFinite(n)?n:CAP)));
const sleep=ms=>new Promise(r=>setTimeout(r,fast?Math.max(1,Math.round(ms*.24)):ms));
const floorNow=()=>Math.min(10,Math.floor(Math.min(99,st.spins)/10)+1);
const save=()=>{try{st.board=board.map(t=>({...t}));localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}};
function beep(f=460,t=.12,wave='sine',vol=.055){if(mute)return;try{const AC=window.AudioContext||window.webkitAudioContext;audio=audio||new AC();if(audio.state==='suspended')audio.resume().catch(()=>{});const o=audio.createOscillator(),g=audio.createGain(),now=audio.currentTime;o.type=wave;o.frequency.value=f;g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(vol,now+.012);g.gain.exponentialRampToValueAtTime(.0001,now+t);o.connect(g);g.connect(audio.destination);o.start(now);o.stop(now+t+.01);}catch(e){}}
function vib(p){try{navigator.vibrate?.(p)}catch(e){}}
function flash(){const e=$('flash');e.classList.add('on');setTimeout(()=>e.classList.remove('on'),85)}
function confetti(n){const colors=['#ffe78b','#bfff84','#ff78b1','#8edaff'];for(let i=0;i<n;i++){const e=document.createElement('i');e.className='confetti';e.style.cssText=`--x:${Math.random()*100}vw;--dx:${rnd(201)-100}px;--c:${colors[i%4]};--t:${1+Math.random()*.7}s`;document.body.append(e);setTimeout(()=>e.remove(),1900)}}
const neighbors=i=>{const r=Math.floor(i/5),c=i%5;return [[-1,0],[1,0],[0,-1],[0,1]].map(([dr,dc])=>[r+dr,c+dc]).filter(([rr,cc])=>rr>=0&&rr<5&&cc>=0&&cc<5).map(([rr,cc])=>rr*5+cc)};
function tile(prev=-1,echo=-1){let s=rnd(6);if(echo>=0&&Math.random()<.095*lv(27)+.08*lv(24))s=echo;if(prev>=0&&have(5)&&Math.random()<.10*lv(5))s=prev;
 let special=null,shield=0;
 const trials=[[0,'bomb',.029],[2,'light',.026],[3,'slime',.03],[4,'ice',.032],[10,'ghost',.029],[13,'chest',.029],[19,'crown',.025],[20,'wild',.035],[23,'gold',.037]];
 for(const [id,key,p] of trials){if(have(id)&&Math.random()<p*lv(id)){special=key;break;}}
 if(special==='wild')s='w';if(special==='ice'||special==='ghost')shield=1;
 return{s,sp:special,shield};}
function gridFresh(echo=-1){const a=[];for(let i=0;i<25;i++)a[i]=tile(i%5?a[i-1].s:-1,echo);return a;}
function glyph(t){return t?.s==='w'?'🌟':ICON[t?.s??0]}
const marks={bomb:'💣',light:'⚡',slime:'🦠',ice:'🧊',ghost:'👻',chest:'🎁',crown:'👑',gold:'✨'};
function draw(drop=false){for(let i=0;i<25;i++){const t=board[i],e=cell[i];e.className='cell'+(t?.sp?' special':'')+(t?.s==='w'?' wild':'')+(drop?' falling':'');e.querySelector('.symbol').textContent=t?glyph(t):'';e.querySelector('.stamp').textContent=t?.sp&&t.sp!=='wild'?marks[t.sp]||'':'';}}
function countLines(grid){return matches(grid).length;}
function matches(g){const map=new Map();for(const [dr,dc] of DIR){for(let r=0;r<5;r++)for(let c=0;c<5;c++){for(let s=0;s<6;s++){
 const ok=(rr,cc)=>{if(rr<0||rr>=5||cc<0||cc>=5)return false;const t=g[rr*5+cc];return !!t&&(t.s===s||t.s==='w');};
 if(ok(r-dr,c-dc))continue;
 const idx=[];for(let rr=r,cc=c;ok(rr,cc);rr+=dr,cc+=dc)idx.push(rr*5+cc);
 if(idx.length<3)continue;
 const key=dr+','+dc+':'+idx.join(',');const previous=map.get(key);
 if(!previous||BASE[s]>BASE[previous.s])map.set(key,{s,len:idx.length,idx});
 }}}
 return [...map.values()].sort((a,b)=>b.len-a.len||Math.min(...a.idx)-Math.min(...b.idx));}
function chainMult(chain){return chain<=5?Math.pow(2,chain-1):16*Math.pow(1.4,Math.min(8,chain-5));}
function linePay(hit,g,chain){const length=hit.len;let val=BASE[hit.s]*(length===3?1:length===4?3.1:8);const gold=hit.idx.filter(i=>g[i].sp==='gold').length;val+=gold*140;return cap(val*chainMult(chain));}
function render(){const f=floorNow(),within=st.spins%10;
 $('score').textContent=fmt(st.score);$('floor').textContent='FLOOR '+f+' / 10';$('spins').textContent=st.spins+' / 100 SPINS';$('barfill').style.width=(within*10)+'%';$('floorDesc').textContent=(10-within)+'回転で'+(f===10?'終了':'次の階へ');$('best').textContent='BEST '+fmt(st.best);
 $('speed').textContent=fast?'高速':'通常';$('audio').textContent=mute?'🔇':'🔊';const present=CARDS.filter(x=>have(x[0]));$('ownedCount').textContent=present.length;
 $('owned').innerHTML=present.length?present.map(x=>`<span class="pill">${x[1]} ${x[2]}${lv(x[0])>1?' Lv.'+lv(x[0]):''}</span>`).join(''):'<span class="tiny">まだなし</span>';
 const co=COMBOS.filter(x=>combo(x.a,x.b));$('fusions').textContent=co.length?'合体：'+co.map(x=>x.name).join(' / '):'ギミック同士で自動合体することがある！';
 const isBoss=f===5||f===10;
 $('boss').classList.toggle('hidden',!isBoss);
 if(isBoss){const hpMax=f===5?7300:16200;const hp=(st.boss&&st.boss.floor===f)?st.boss.hp:hpMax;$('bossName').textContent=(f===5?'👹 中ボス':'👑 最終ボス')+' · 残り'+(10-(st.spins%10))+'回';$('bossHp').textContent=hp<=0?'撃破！':'HP '+fmt(hp);$('bossFill').style.width=Math.min(100,100*hp/hpMax)+'%';}
 $('spin').disabled=busy||st.pending>0||st.spins>=100||!$('overlay').classList.contains('hidden');}
function open(html){$('dialog').innerHTML=html;$('overlay').classList.remove('hidden');render()}
function close(){$('overlay').classList.add('hidden');render()}
function candidates(){const available=CARDS.filter(x=>x[5]<=floorNow()&&lv(x[0])<x[4]);const picks=[];while(picks.length<3&&available.length){const weights=available.map(x=>1+(COMBOS.some(z=>(z.a===x[0]&&have(z.b))||(z.b===x[0]&&have(z.a)))?4:0)+(lv(x[0])?1:0));let n=Math.random()*weights.reduce((a,b)=>a+b,0),pos=0;while(pos<weights.length-1&&n>=weights[pos])n-=weights[pos++];picks.push(available.splice(pos,1)[0]);}return picks;}
function chooseUpgrade(){const opts=candidates();if(!opts.length){st.pending=0;save();return resume();}
 const initial=!st.started;open(`<div class="eyebrow">${initial?'STARTER GIMMICK':'FLOOR CLEAR · REWARD'}</div><h2>${initial?'最初のギミックを選ぼう！':'✨ 強化を1つ選ぼう！'}</h2><p>${initial?'この能力を持って100回転スタート！':'強化はそのプレイの間ずっと有効。<br>ボスや連鎖を突破しよう！'}<br>残り選択：${st.pending}回</p><div id="choices"></div>`);
 const box=$('choices');opts.forEach(x=>{const button=document.createElement('button');button.className='choice';const sy=COMBOS.find(z=>(z.a===x[0]&&have(z.b))||(z.b===x[0]&&have(z.a)));button.innerHTML=`<span class="emoji">${x[1]}</span><span><strong>${x[2]} ${lv(x[0])?'Lv.'+(lv(x[0])+1):''}</strong><small>${x[3]}${x[4]>1?'（重ねて強化可能）':''}</small>${sy?'<span class="tag">⚡ 合体！ '+sy.name+'</span>':''}</span>`;
 button.onclick=()=>{st.cards[x[0]]=lv(x[0])+1;st.pending=Math.max(0,st.pending-1);st.started=true;save();close();beep(880,.15,'triangle',.065);if(st.pending>0)chooseUpgrade();else resume();};box.append(button);});}
function ensureBoss(f){if((f===5||f===10)&&(!st.boss||st.boss.floor!==f)){st.boss={floor:f,hp:f===5?7300:16200};save();}}
function resume(){if(st.spins>=100){finish();return;}if(st.pending>0){chooseUpgrade();return;}ensureBoss(floorNow());render()}
function finish(){const success=st.bossWins.includes(10);open(`<div class="eyebrow">100 SPINS COMPLETE</div><h2>${success?'👑 全階層制覇！':'🎰 CHALLENGE COMPLETE'}</h2><p>今回はこんなスロットに成長したで！</p><div class="eyebrow">FINAL SCORE</div><div class="score" style="color:#ffda70">${fmt(st.score)}</div><p>最大連鎖：${st.maxChain} CHAIN<br>最大1回転：${fmt(st.maxTurn)}点<br>所持ギミック：${Object.keys(st.cards).length}種類<br>ボス撃破：${st.bossWins.length} / 2<br>自己ベスト：${fmt(st.best)}</p><button class="primary" id="again">もう1プレイ！</button>`);$('again').onclick=restart;}
function restart(){if(busy)return;st=fresh(st.best);board=gridFresh();save();draw();close();$('message').textContent='SPINで連鎖を起こせ！';chooseUpgrade()}
function scoreAt(hit,val){const base=$('machine').getBoundingClientRect();let x=0,y=0;hit.idx.forEach(i=>{const r=cell[i].getBoundingClientRect();x+=(r.left+r.width/2-base.left)/hit.idx.length;y+=(r.top+r.height/2-base.top)/hit.idx.length});const e=document.createElement('div');e.className='float';e.style.left=x+'px';e.style.top=y+'px';e.textContent='+'+fmt(val);$('machine').append(e);setTimeout(()=>e.remove(),750);}
function turnOverlay(total,chain){const div=document.createElement('div');div.className='total';div.innerHTML=`<small>TURN SCORE</small><strong>+${fmt(total)}</strong><span>${chain?chain+' CHAIN!':'NEXT SPIN!'}</span>`;$('machine').append(div);setTimeout(()=>div.remove(),fast?400:1150);}
function shuffleColumns(g){const a=rnd(5),b=(a+1+rnd(4))%5;for(let r=0;r<5;r++){[g[r*5+a],g[r*5+b]]=[g[r*5+b],g[r*5+a]]}}
function arrange(g,extra=false){if(have(6)){for(let k=0;k<lv(6)+(extra?1:0);k++){const r=rnd(5),c=rnd(4),i=r*5+c;if(Math.random()<.48)g[i+1].s=g[i].s;}}if(have(17)){for(let k=0;k<lv(17);k++){const c=rnd(5),r=rnd(4),i=r*5+c;if(Math.random()<.53)g[i+5].s=g[i].s;}}}
function initialGrid(spin){let a=gridFresh();if(have(22)&&spin%8===0){const s=rnd(6);for(let k=0;k<5;k++)a[rnd(25)].s=s;}$('message').textContent=have(22)&&spin%8===0?'🌈 虹の奇跡！':'リール回転中…';
 if(have(15)&&spin%4===0){const b=a.map(t=>({...t})),col=rnd(5);for(let r=0;r<5;r++)b[r*5+col]=tile();if(countLines(b)>=countLines(a))a=b;}
 if(have(11)){let chosen=a,best=countLines(a);for(let k=0;k<4;k++){const b=chosen.map(t=>({...t}));shuffleColumns(b);const lines=countLines(b);if(lines>best){chosen=b;best=lines;}}a=chosen;}
 if(have(18)){let best=countLines(a);for(let k=0;k<20;k++){const i=rnd(25),j=rnd(25);[a[i],a[j]]=[a[j],a[i]];const n=countLines(a);if(n>=best){best=n;break;}[a[i],a[j]]=[a[j],a[i]];}}
 arrange(a);
 if(have(26)){const b=gridFresh();arrange(b);if(countLines(b)>countLines(a))a=b;}
 return a;}
function blankNeighborsRemoved(removed,center){for(const v of neighbors(center))removed.add(v);for(const dr of [-1,1])for(const dc of [-1,1]){const r=Math.floor(center/5)+dr,c=center%5+dc;if(r>=0&&r<5&&c>=0&&c<5)removed.add(r*5+c)}}
function specialProcess(hits,removed,chain,context){const signal=new Set();const bombQueue=[];const specials=new Set();const primary=hits[0]||null;
 for(const i of [...removed]){const t=board[i];if(!t)continue;
 if(t.sp==='bomb'&&have(0)){bombQueue.push(i);specials.add('bomb');}
 if(t.sp==='light'&&have(2)){signal.add(t.s);specials.add('light');}
 if(t.sp==='slime'&&have(3)){const ns=neighbors(i).filter(j=>!removed.has(j));for(let j=0;j<Math.min(ns.length,2*lv(3));j++){board[ns[j]].s=t.s;}specials.add('slime');}
 if(t.sp==='chest'&&have(13)){context.wild+=2*lv(13);specials.add('chest');}
 if(t.sp==='crown'&&have(19)){const cands=board.map((z,j)=>z.s===t.s&&!removed.has(j)?j:-1).filter(j=>j>=0);for(let j=0;j<Math.min(cands.length,combo(19,20)?5:3);j++)board[cands[j]].s='w';specials.add('crown');}
 if((t.sp==='ice'||t.sp==='ghost')&&t.shield>0){if(t.sp==='ghost'){t.s='w';t.sp='wild';t.shield=0;specials.add('ghost');}else{t.shield--;t.sp=null;specials.add('shield');}removed.delete(i);}
 }
 if(bombQueue.length){const seen=new Set();while(bombQueue.length){const i=bombQueue.shift();if(seen.has(i))continue;seen.add(i);const previous=new Set(removed);blankNeighborsRemoved(removed,i);if(have(1)){for(const v of removed){if(!previous.has(v)&&board[v]?.sp==='bomb')bombQueue.push(v);}}if(combo(0,2))signal.add(board[i].s);}}
 if(signal.size){for(const s of signal){for(let i=0;i<25;i++){if(board[i].s===s)removed.add(i);}}}
 if(combo(3,2)&&specials.has('slime')&&specials.has('light')){if(primary)for(let i=0;i<25;i++)if(board[i].s===primary.s)removed.add(i);}
 if(have(7)&&primary){const origin=primary.idx[rnd(primary.idx.length)];let list=neighbors(origin).filter(j=>!removed.has(j));for(let k=0;k<Math.min(list.length,2*lv(7));k++){board[list[k]].s=primary.s;if(combo(7,16))removed.add(list[k]);}}
 if(have(16)&&chain>=2&&primary){for(const j of neighbors(primary.idx[0]).slice(0,4))removed.add(j);specials.add('fire');}
 if(have(8)&&primary){context.split=primary.s;context.splitCount=2*lv(8);}
 if(have(9)&&primary)context.echo=primary.s;
 if(have(12)&&chain===3){const c=rnd(5);for(let r=0;r<5;r++)removed.add(r*5+c);specials.add('timebomb');}
 if(have(25)&&chain===4){const r=rnd(5);for(let c=0;c<5;c++)removed.add(r*5+c);specials.add('breaker');}
 if(have(28)&&chain===(combo(14,28)?4:5)){const r=rnd(4);for(let c=0;c<5;c++){removed.add(r*5+c);removed.add((r+1)*5+c);}specials.add('dragon');}
 if(have(29)&&specials.size>=2)context.wild+=2;
 if(specials.size)context.notes.push([...specials].map(s=>({bomb:'💣爆発',light:'⚡雷撃',slime:'🦠増殖',chest:'🎁宝箱',crown:'👑王冠',shield:'🧊防御',ghost:'👻万能化',fire:'🔥炎',timebomb:'🧨時限',breaker:'💥貫通',dragon:'🐉ドラゴン'})[s]).filter(Boolean).join(' ＋ '));
 return removed;}
function refill(removed,ctx,chain){for(let c=0;c<5;c++){const keep=[];for(let r=4;r>=0;r--){const i=r*5+c;if(!removed.has(i))keep.push({...board[i]});}
 for(let r=4;r>=0;r--){const i=r*5+c;const from=keep[4-r];if(from){board[i]=from;}else{board[i]=tile(c?board[i-1]?.s:-1,ctx.echo);
 if(ctx.splitCount>0){board[i].s=ctx.split;ctx.splitCount--;}
 if(ctx.wild>0){board[i].s='w';board[i].sp='wild';ctx.wild--;}
 }}}
 if(have(14)&&chain>=2){for(let k=0;k<lv(14);k++){const i=rnd(25),nb=neighbors(i);if(nb.length)board[i].s=board[nb[rnd(nb.length)]].s;}}
 if(chain<=2||Math.random()<(chain>=6?.18:.50))arrange(board,combo(6,17));}
async function doSpin(){if(busy||st.pending||st.spins>=100||!$('overlay').classList.contains('hidden'))return;busy=true;render();const f=floorNow(),spinNumber=st.spins+1;ensureBoss(f);const result=initialGrid(spinNumber);const ended=[false,false,false,false,false];cell.forEach(e=>{e.className='cell roll';e.querySelector('.stamp').textContent='';});beep(160,.2,'sawtooth',.06);
 const ticker=setInterval(()=>{for(let i=0;i<25;i++)if(!ended[i%5])cell[i].querySelector('.symbol').textContent=ICON[rnd(6)];},75);
 try{
  for(let c=0;c<5;c++){await sleep(c===0?340:220);ended[c]=true;for(let r=0;r<5;r++){const i=r*5+c,t=result[i];cell[i].className='cell'+(t.sp?' special':'');cell[i].querySelector('.symbol').textContent=glyph(t);cell[i].querySelector('.stamp').textContent=marks[t.sp]||'';}beep(200+c*66,.11,'triangle',.07);vib(20);}
  clearInterval(ticker);board=result;draw();await sleep(150);
  let total=0,chains=0,revived=false;const ctx={wild:0,split:null,splitCount:0,echo:-1,notes:[]};
  while(chains<16){const hits=matches(board);if(!hits.length){if(!revived&&have(21)&&chains===0){revived=true;for(let k=0;k<6;k++)board[rnd(25)]=tile();if(matches(board).length===0){const r=rnd(5),c=rnd(3),s=rnd(6);for(let j=0;j<3;j++)board[r*5+c+j].s=s;}$('message').textContent='♾️ 再生！';draw(true);await sleep(340);continue;}break;}
   chains++;st.maxChain=Math.max(st.maxChain,chains);$('message').className='message'+(chains>=3?' hot':'');$('message').textContent=(chains>=10?'👑 LEGEND CHAIN! ':chains>=7?'💥 MEGA CHAIN! ':chains>=4?'🔥 BIG CHAIN! ':'')+chains+' CHAIN ×'+Number(chainMult(chains).toFixed(1));if(chains>=4){if([4,7,10].includes(chains)){flash();confetti(chains>=10?55:chains>=7?35:12);} beep(520+Math.min(6,chains)*85,.18,'sawtooth',.07);vib([35,20,50]);}
   const removed=new Set();let shown=0;for(const hit of hits){const val=linePay(hit,board,chains);total=cap(total+val);st.score=cap(st.score+val);st.best=Math.max(st.best,st.score);hit.idx.forEach(i=>{removed.add(i);cell[i].classList.add('hit')});scoreAt(hit,val);$('score').textContent=fmt(st.score);beep(420+Math.min(7,chains)*65,.12,'triangle',.055);shown++;await sleep(hits.length>9?90:180);hit.idx.forEach(i=>cell[i].classList.remove('hit'));}
   specialProcess(hits,removed,chains,ctx);
   if(ctx.notes.length){$('message').textContent=ctx.notes.slice(-1)[0];beep(195,.23,'sawtooth',.07);await sleep(230);}
   if(removed.size===0)break;
   for(const i of removed)cell[i].classList.add('gone');await sleep(170);refill(removed,ctx,chains+1);draw(true);await sleep(330);
  }
  st.spins++;st.maxTurn=Math.max(st.maxTurn,total);
  if((f===5||f===10)&&st.boss&&st.boss.floor===f&&st.boss.hp>0){const damage=Math.round(180+Math.sqrt(total)*7.8+chains*120*(chains>=5?1.5:1));st.boss.hp=Math.max(0,st.boss.hp-damage);if(st.boss.hp===0&&!st.bossWins.includes(f)){st.bossWins.push(f);flash();confetti(70);$('message').textContent='👑 BOSS DOWN!';}else{$('message').textContent='👹 ボスに '+fmt(damage)+' ダメージ！';}}
  st.history.push({spin:st.spins,score:total,chain:chains});if(st.history.length>100)st.history.shift();
  if(st.spins%10===0&&st.spins<100){st.pending=1+(f===5&&st.bossWins.includes(5)?1:0);}
  st.best=Math.max(st.best,st.score);save();render();turnOverlay(total,chains);await sleep(1100);
  busy=false;
  if(st.spins===100){finish();}else if(st.pending>0){chooseUpgrade();}else{resume();}
 }catch(err){clearInterval(ticker);console.error(err);busy=false;draw();render();$('message').textContent='処理エラー。もう一度SPINしてな。';}
}
for(let i=0;i<25;i++){const e=document.createElement('div');e.className='cell';e.innerHTML='<span class="symbol"></span><span class="stamp"></span>';$('board').append(e);cell.push(e);}
if(Array.isArray(st.board)&&st.board.length===25&&st.board.every(t=>t&&(t.s==='w'||(Number.isInteger(t.s)&&t.s>=0&&t.s<6)))){board=st.board.map(t=>({...t}));}else{board=gridFresh();save();}
draw();render();$('spin').onclick=()=>doSpin();$('speed').onclick=()=>{fast=!fast;try{localStorage.setItem(KEY+'_fast',fast?'1':'0')}catch(e){}render()};$('audio').onclick=()=>{mute=!mute;try{localStorage.setItem(KEY+'_mute',mute?'1':'0')}catch(e){}render();if(!mute)beep(740)};$('reset').onclick=()=>{if(!busy&&confirm('100回転を最初からやり直す？ 自己ベストは残すで。'))restart()};setTimeout(resume,100);
})();
</script>
