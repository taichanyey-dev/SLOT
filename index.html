
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e19">
<title>LUCK LOOP — CHAIN REACTION</title>
<style>
:root{color-scheme:dark;--bg:#0b0e19;--panel:#1a2032;--muted:#a6b1c9;--lime:#bfff6b;--gold:#ffdf78;--edge:#374159}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
body{background:radial-gradient(ellipse at 50% -15%,#30244e 0%,#0b0e19 65%);overscroll-behavior:none}
button{font:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.46;cursor:default}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.app{max-width:450px;margin:auto;min-height:100dvh;padding:calc(12px + env(safe-area-inset-top)) 14px calc(15px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:9px}
.brand{font-size:25px;font-weight:1000;letter-spacing:-1.6px;line-height:1}
.brand b{color:var(--lime)}
.sub{font-size:10px;letter-spacing:1.65px;color:var(--muted);font-weight:850;margin-top:5px}
.tools{display:flex;gap:5px}
.tool{height:36px;min-width:40px;border-radius:11px;background:#242a40;color:#e7ebf6;border:1px solid #46506b;font-size:12px;font-weight:900;padding:0 8px}
.scorebox{background:linear-gradient(135deg,#262a46,#191f31);border:1px solid var(--edge);border-radius:17px;padding:14px}
.label{color:var(--muted);font-size:10px;font-weight:900;letter-spacing:1.1px}
.score{font-size:clamp(33px,9vw,44px);font-weight:1000;line-height:1.2;letter-spacing:-1.3px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.statsRight{text-align:right}
.smallnum{font-size:18px;font-weight:1000;font-variant-numeric:tabular-nums}
.bar{height:9px;background:#3a4159;border-radius:20px;overflow:hidden;margin:9px 0 5px}
.fill{width:0;height:100%;background:linear-gradient(90deg,#6cd8bd,var(--lime));border-radius:inherit;transition:width .22s}
.footnote{font-size:11px;color:#b4bfd5;font-weight:700}
.footnote strong{color:white}
.machine{position:relative;border:2px solid #5b567e;border-radius:23px;padding:12px;background:linear-gradient(160deg,#2e3048,#191e30 62%,#30304d);box-shadow:0 7px #090b15,0 14px 23px #0007;isolation:isolate}
.machineHead{text-align:center;color:var(--gold);font-weight:1000;letter-spacing:2.6px;font-size:11px;padding:1px 0 12px}
.machineHead span{color:#d1a9ff}
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.cell{position:relative;aspect-ratio:1/1;min-width:0;display:grid;place-items:center;border-radius:12px;border:2px solid #c5cddd;background:linear-gradient(#fff,#e3e8f2 48%,#fff);box-shadow:inset 0 0 13px #a6b3d1;color:#182035;font-size:clamp(30px,10vw,49px);user-select:none;line-height:1;transition:transform .17s,opacity .17s,background .17s}
.cell.gold{background:linear-gradient(#fff7c8,#ffd66f 55%,#fff2b0);border-color:#fff0a6;box-shadow:0 0 11px #e8a84266,inset 0 0 11px #d4a34b}
.cell.match{z-index:2;transform:scale(1.10);background:#fff2a1;box-shadow:0 0 23px #ffce50,inset 0 0 15px #ffb650;border-color:#fff8af}
.cell.clear{transform:scale(.2) rotate(12deg);opacity:0}
.cell.fall{animation:drop .28s cubic-bezier(.15,.9,.37,1.15)}
.cell.spinny{animation:roll .14s linear infinite}
@keyframes roll{
0%{filter:blur(1px);transform:translateY(-4px)}
50%{filter:blur(1px);transform:translateY(4px)}
100%{filter:blur(1px);transform:translateY(-4px)}
}
@keyframes drop{
0%{transform:translateY(-24px);opacity:.2}
70%{transform:translateY(3px);opacity:1}
100%{transform:translateY(0)}
}
@keyframes impact{
0%{transform:scale(.6);opacity:0}
25%{transform:scale(1.16);opacity:1}
80%{opacity:1}
100%{transform:scale(1.25);opacity:0}
}
.chainBox{height:42px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:15px;font-weight:1000;color:var(--muted)}
.chainBox.hot{color:var(--gold);text-shadow:0 0 14px #f7c455aa}
.float{position:absolute;z-index:8;pointer-events:none;transform:translate(-50%,-50%);font-weight:1000;font-variant-numeric:tabular-nums;color:#fffadd;font-size:17px;white-space:nowrap;text-shadow:0 2px 3px #15131b,0 0 12px #ffb936;animation:up .5s ease-out forwards}
@keyframes up{
0%{opacity:0;transform:translate(-50%,-20%) scale(.6)}
30%{opacity:1;transform:translate(-50%,-65%) scale(1.17)}
100%{opacity:0;transform:translate(-50%,-135%)}
}
.totalOverlay{position:absolute;z-index:12;inset:15% 0 16%;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;background:radial-gradient(ellipse,#131221e8,#1511228a 65%,transparent 78%);animation:impact 1.05s both}
.totalOverlay .kicker{font-size:12px;color:#fbe3a5;letter-spacing:2px;font-weight:1000}
.totalOverlay .big{font-size:clamp(35px,11vw,53px);font-weight:1000;color:#fff2a8;text-shadow:0 3px #bd6a37,0 0 24px #ffc75b;letter-spacing:-1px;overflow-wrap:anywhere;max-width:95%;text-align:center}
.totalOverlay .details{font-size:13px;color:#fff;font-weight:950}
.spin{border:0;width:100%;height:73px;border-radius:19px;background:linear-gradient(135deg,#daff83,#8cf6ac);color:#152018;font-size:28px;font-weight:1000;letter-spacing:2px;box-shadow:0 6px #3a8755,0 12px 20px #0007}
.spin:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px #3a8755}
.spin:disabled{filter:grayscale(.55)}
.helper{text-align:center;font-size:11px;line-height:1.55;color:#b4bfd5;margin:-1px 0 0}
.powers{background:#181e2f;border:1px solid #353d58;border-radius:14px;padding:11px}
.pillRow{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.pill{background:#303950;color:#e4edf8;border-radius:7px;padding:5px 7px;font-size:10px;font-weight:800}
.footer{display:flex;justify-content:space-between;align-items:center;margin-top:auto;font-size:10px;color:#8792aa}
.reset{border:0;background:none;color:#aab4ca;text-decoration:underline;font-size:11px;padding:7px}
.overlay{position:fixed;inset:0;background:#050712e8;z-index:40;display:grid;place-items:center;padding:18px;backdrop-filter:blur(8px)}
.overlay.hidden{display:none}
.dialog{width:min(100%,410px);max-height:91dvh;overflow:auto;background:linear-gradient(160deg,#303850,#171c2e);border:1px solid #626d89;border-radius:22px;padding:20px 16px;text-align:center;box-shadow:0 22px 80px #000b}
.dialog h2{font-size:28px;margin:5px 0;color:var(--lime)}
.dialog p{font-size:12px;color:#c9d1e2;line-height:1.6;margin:8px 0 14px}
.upgrade{width:100%;display:flex;align-items:center;text-align:left;gap:12px;color:white;background:#303b53;border:1px solid #58657f;border-radius:14px;padding:12px;margin:8px 0}
.upgrade:active{background:#4c5d78}
.upgrade .emoji{font-size:29px;width:34px;text-align:center}
.upgrade strong{display:block;font-size:15px}
.upgrade small{display:block;font-size:11px;line-height:1.5;color:#c7d4e6;margin-top:3px}
.category{font-size:9px;letter-spacing:1px;font-weight:900;color:#abf2cb;margin-bottom:2px}
.primary{background:var(--lime);border:0;border-radius:14px;width:100%;padding:14px;color:#142017;font-size:17px;font-weight:1000}
.flash{position:fixed;inset:0;pointer-events:none;z-index:29;opacity:0;background:#fff5bf;transition:opacity .23s}
.flash.on{opacity:.32;transition:none}
.confetti{position:fixed;top:-5vh;left:var(--x);z-index:30;width:8px;height:12px;background:var(--c);pointer-events:none;animation:rain var(--t) linear forwards}
.confetti:nth-child(2n){border-radius:5px}
@keyframes rain{
to{transform:translate(var(--dx),106vh) rotate(900deg);opacity:.15}
}
@media(max-height:770px){
.app{gap:9px}
.scorebox{padding:10px}
.machine{padding:9px}
.machineHead{padding-bottom:7px}
.chainBox{height:34px}
.spin{height:64px}
.board{gap:5px}
.cell{border-radius:9px}
}
@media(prefers-reduced-motion:reduce){
.cell.spinny,.cell.fall,.totalOverlay,.float,.confetti{animation:none!important}
.cell{transition:none!important}
}
</style>
</head>
<body>
<main class="app">
<header class="row">
  <div>
    <div class="brand">LUCK <b>LOOP</b></div>
    <div class="sub">CHAIN REACTION · 5 × 5</div>
  </div>
  <div class="tools">
    <button class="tool" id="speed" title="演出速度">通常</button>
    <button class="tool" id="sound" title="効果音">🔊</button>
  </div>
</header>
<section class="scorebox">
  <div class="row">
    <div>
      <div class="label">TOTAL SCORE</div>
      <div id="score" class="score">0</div>
    </div>
    <div class="statsRight">
      <div class="label">BEST</div>
      <div class="smallnum" id="best">0</div>
      <div class="label" style="margin-top:4px">
        <span id="spins">0</span> / 100 SPINS
      </div>
    </div>
  </div>
  <div class="bar"><div class="fill" id="bar"></div></div>
  <div class="row footnote">
    <span>⚡ 次の強化 <strong id="goal">500</strong></span>
    <span id="remaining">あと 500</span>
  </div>
</section>
<section class="machine" id="machine">
  <div class="machineHead">✦ <span>CHAIN</span> REACTION ✦</div>
  <div class="board" id="board"></div>
  <div class="chainBox" id="chain" aria-live="polite">
    SPINして連鎖を起こせ！
  </div>
</section>
<button id="spin" class="spin">SPIN !</button>
<p class="helper">
  縦・横・斜め3つ以上で当たり<br>
  そろう → 消える → 落ちる → またそろう！
</p>
<section class="powers">
  <div class="row">
    <span style="font-size:12px;font-weight:900">
      ✨ 強化アイテム
    </span>
    <span id="upcount" class="footnote">0回獲得</span>
  </div>
  <div class="pillRow" id="owned">
    <span class="pill">まだなし</span>
  </div>
</section>
<footer class="footer">
  <span>オフライン・自動セーブ</span>
  <button id="reset" class="reset">最初から</button>
</footer>
</main>
<div class="flash" id="flash"></div>
<div id="overlay" class="overlay hidden">
  <div id="dialog" class="dialog"></div>
</div>
<script>
(()=>{
'use strict';

const $=id=>document.getElementById(id);
const ICON=['🍒','🍋','🍀','🔔','💎','7️⃣'];
const BASE_WEIGHT=[24,21,19,16,12,8];
const BASE_PAY=[40,50,65,85,130,220];
const SAVE_KEY='luck_loop_chain_reaction_v1';
const SCORE_CAP=999999999999;
const dirs=[[0,1],[1,0],[1,1],[1,-1]];

// id, 絵文字, 名前, 説明, 系統, 最大レベル
const UP=[
[0,'🍒','チェリー運','🍒が出やすくなる','運',4],
[1,'🍋','レモン運','🍋が出やすくなる','運',4],
[2,'🍀','クローバー運','🍀が出やすくなる','運',4],
[3,'🔔','ベル運','🔔が出やすくなる','運',4],
[4,'💎','ダイヤ運','💎が出やすくなる','運',4],
[5,'7️⃣','セブン運','7️⃣が出やすくなる','運',4],
[6,'🧲','左コピー','新しい絵柄が左隣をコピーする確率 +8%','運',3],
[7,'⬆️','上コピー','新しい絵柄が上隣をコピーする確率 +8%','運',3],
[8,'🌟','ワイルド運','万能マスの出現率 +2%','運',4],
[9,'🌈','虹の奇跡','SPIN時、3%で6マスを同じ絵柄にする','運',3],
[10,'🚀','得点アップ','すべての当たり得点 +25%','得点',5],
[11,'🍒','3連強化','3個そろいの得点 +50%','得点',5],
[12,'💥','4連強化','4個そろいの得点 +75%','得点',5],
[13,'👑','5連強化','5個そろいの得点 +150%','得点',5],
[14,'🍓','チェリー王','🍒でそろった得点 +60%','得点',5],
[15,'7️⃣','セブン王','7️⃣でそろった得点 +120%','得点',5],
[16,'✨','黄金強化','黄金マスを含む当たりの倍率 +0.5','得点',4],
[17,'💣','爆弾','爆弾の出現率 +2%。そろうと周囲も消す','連鎖',4],
[18,'👑','黄金化','黄金マスの出現率 +2%','連鎖',4],
[19,'🔥','連鎖王','連鎖ごとの倍率の増え方 +0.4','連鎖',4],
[20,'♾️','不滅','連鎖終了時15%で6マスを再抽選（1回）','連鎖',3],
[21,'🛟','敗者復活','初回ハズレ時25%で3連を作る','連鎖',3],
[22,'🌟','ワイルドの祝福','5回転ごとにワイルドを2マス追加','連鎖',2],
[23,'🌧️','黄金の雨','2連鎖目から黄金マスの出現率 +6%','連鎖',3]
];

const byId=id=>UP.find(x=>x[0]===id);

const fresh=()=>({
  spins:0,
  score:0,
  best:0,
  powers:{},
  upgrades:0,
  board:null,
  maxChain:0,
  bestTurn:0
});

let state=fresh();
let busy=false;
let mute=false;
let fast=false;
let ac=null;
let pendingUp=0;
let board=[];
let cellEls=[];

try{
  const v=JSON.parse(localStorage.getItem(SAVE_KEY));

  if(
    v&&
    Number.isInteger(v.spins)&&
    v.spins>=0&&v.spins<=100&&
    Number.isFinite(v.score)&&
    v.score>=0&&v.score<=SCORE_CAP&&
    v.powers&&typeof v.powers==='object'
  ){
    state={...fresh(),...v};
  }

  mute=localStorage.getItem(SAVE_KEY+'_mute')==='1';
  fast=localStorage.getItem(SAVE_KEY+'_fast')==='1';
}catch(e){}

const lv=id=>Math.min(
  byId(id)[5],
  Math.max(0,Number(state.powers[id])||0)
);

const num=n=>Math.floor(n).toLocaleString('ja-JP');
const clamp=n=>Math.max(
  0,Math.min(SCORE_CAP,Math.round(n))
);

const rnd=n=>Math.floor(Math.random()*n);
const sleep=ms=>new Promise(
  r=>setTimeout(r,fast?Math.round(ms*.22):ms)
);

const save=()=>{
  try{
    state.board=board.map(x=>({...x}));
    localStorage.setItem(SAVE_KEY,JSON.stringify(state));
  }catch(e){}
};

const nextGoal=n=>Math.min(
  SCORE_CAP,
  Math.round(
    (500*(Math.pow(1.45,n+1)-1)/.45)/10
  )*10
);

// 音
function beep(
  freq=440,
  duration=.12,
  type='sine',
  volume=.045,
  delay=0
){
  if(mute)return;

  try{
    const AC=window.AudioContext||
      window.webkitAudioContext;
    if(!AC)return;

    ac=ac||new AC();

    if(ac.state==='suspended'){
      ac.resume().catch(()=>{});
    }

    const o=ac.createOscillator();
    const g=ac.createGain();
    const t=ac.currentTime+delay;

    o.type=type;
    o.frequency.setValueAtTime(freq,t);

    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(
      Math.max(.001,volume),t+.012
    );
    g.gain.exponentialRampToValueAtTime(
      .0001,t+duration
    );

    o.connect(g);
    g.connect(ac.destination);
    o.start(t);
    o.stop(t+duration+.015);
  }catch(e){}
}

function vibrate(a){
  try{navigator.vibrate?.(a)}
  catch(e){}
}

function confetti(count){
  const palette=[
    '#ffe27b',
    '#f993b9',
    '#bfff6b',
    '#7edaff',
    '#ffffff'
  ];

  for(let i=0;i<count;i++){
    const e=document.createElement('i');
    e.className='confetti';

    e.style.cssText=`
      --x:${Math.random()*100}vw;
      --dx:${rnd(201)-100}px;
      --c:${palette[i%5]};
      --t:${.8+Math.random()*.8}s
    `;

    document.body.appendChild(e);
    setTimeout(()=>e.remove(),1800);
  }
}

function flash(){
  const x=$('flash');
  x.classList.add('on');

  setTimeout(()=>{
    x.classList.remove('on');
  },90);
}

// 絵柄の出現確率
function pickSymbol(){
  const w=BASE_WEIGHT.map(
    (x,i)=>x+lv(i)*(i===5?5:i>=4?6:7)
  );

  let v=Math.random()*w.reduce((a,b)=>a+b,0);

  for(let i=0;i<6;i++){
    v-=w[i];
    if(v<0)return i;
  }

  return 5;
}

// 新しい絵柄を作成
function makeTile(context=null){
  const chain=context?.chain||0;

  const wp=Math.min(.19,.008+.02*lv(8));
  const bp=Math.min(.14,.005+.02*lv(17));

  const r=Math.random();

  let sym=r<bp?'b':
    r<bp+wp?'w':pickSymbol();

  const goldChance=Math.min(
    .32,
    .01+.02*lv(18)+
    (chain>=2?.06*lv(23):0)
  );

  return {
    s:sym,
    gold:Math.random()<goldChance
  };
}

function fillNewGrid(chain=0){
  const out=Array(25).fill(null);

  for(let i=0;i<25;i++){
    out[i]=makeTile({chain});

    const row=Math.floor(i/5);
    const col=i%5;

    if(
      col>0&&
      Math.random()<.08*lv(6)
    ){
      out[i].s=out[i-1].s;
    }else if(
      row>0&&
      Math.random()<.08*lv(7)
    ){
      out[i].s=out[i-5].s;
    }
  }

  return out;
}

function symLabel(s){
  return s==='w'?'🌟':
    s==='b'?'💣':ICON[s];
}

function drawGrid(animate=false){
  for(let i=0;i<25;i++){
    const t=board[i];
    const e=cellEls[i];

    e.textContent=t?symLabel(t.s):'';

    e.className=
      'cell'+
      (t?.gold?' gold':'')+
      (animate?' fall':'');
  }
}

// 画面表示更新
function render(){
  $('score').textContent=num(state.score);

  $('best').textContent=num(
    Math.max(state.best,state.score)
  );

  $('spins').textContent=state.spins;

  const goal=nextGoal(state.upgrades);
  const prev=state.upgrades?
    nextGoal(state.upgrades-1):0;

  $('goal').textContent=num(goal);

  $('remaining').textContent=
    state.score>=goal?
      '強化できる！':
      'あと '+num(goal-state.score);

  $('bar').style.width=
    `${Math.max(0,Math.min(
      100,
      100*(state.score-prev)/
      Math.max(1,goal-prev)
    ))}%`;

  $('upcount').textContent=
    state.upgrades+'回獲得';

  const owned=UP
    .filter(p=>lv(p[0]))
    .map(p=>`
      <span class="pill">
        ${p[1]} ${p[2]}
        ${lv(p[0])>1?' Lv.'+lv(p[0]):''}
      </span>
    `);

  $('owned').innerHTML=
    owned.join('')||
    '<span class="pill">まだなし</span>';

  $('sound').textContent=mute?'🔇':'🔊';
  $('speed').textContent=fast?'高速':'通常';

  $('spin').disabled=
    busy||
    state.spins>=100||
    !$('overlay').classList.contains('hidden');
}

// 縦・横・斜め3つ以上の当たりを検出
function matches(grid){
  const candidates=new Map();

  for(const [dr,dc] of dirs){
    for(let r=0;r<5;r++){
      for(let c=0;c<5;c++){
        for(let s=0;s<6;s++){
          const prevR=r-dr;
          const prevC=c-dc;

          const ok=i=>grid[i]&&(
            grid[i].s===s||
            grid[i].s==='w'||
            grid[i].s==='b'
          );

          if(
            prevR>=0&&prevR<5&&
            prevC>=0&&prevC<5&&
            ok(prevR*5+prevC)
          )continue;

          const idx=[];

          for(
            let rr=r,cc=c;
            rr>=0&&rr<5&&
            cc>=0&&cc<5&&
            ok(rr*5+cc);
            rr+=dr,cc+=dc
          ){
            idx.push(rr*5+cc);
          }

          if(idx.length<3)continue;

          const key=
            dr+','+dc+':'+idx.join(',');

          const prior=candidates.get(key);

          if(
            !prior||
            BASE_PAY[s]>BASE_PAY[prior.s]
          ){
            candidates.set(key,{
              s,
              idx,
              len:idx.length
            });
          }
        }
      }
    }
  }

  return [...candidates.values()].sort(
    (a,b)=>
      b.len-a.len||
      Math.min(...a.idx)-Math.min(...b.idx)
  );
}

// 当たり得点
function pay(match,grid,chain){
  const len=match.len;

  let v=BASE_PAY[match.s]*(
    len===3?1:
    len===4?4:12
  );

  // 基本得点強化
  v*=1+.25*lv(10);

  // 3・4・5連強化
  v*=1+(
    len===3?.50*lv(11):
    len===4?.75*lv(12):
    1.5*lv(13)
  );

  // 絵柄別ボーナス
  if(match.s===0){
    v*=1+.60*lv(14);
  }

  if(match.s===5){
    v*=1+1.2*lv(15);
  }

  // 黄金マス
  if(match.idx.some(i=>grid[i].gold)){
    v*=2+.5*lv(16);
  }

  // 連鎖倍率
  const mult=Math.min(
    512,
    Math.pow(
      2+.4*lv(19),
      chain-1
    )
  );

  return clamp(v*mult);
}

// SPINで出る盤面を作成
function rollGrid(spin){
  let g=fillNewGrid();

  // 虹の奇跡
  if(
    lv(9)&&
    Math.random()<.03*lv(9)
  ){
    const symbol=pickSymbol();

    const positions=[
      ...Array(25).keys()
    ].sort(
      ()=>Math.random()-.5
    ).slice(0,6);

    positions.forEach(i=>{
      g[i].s=symbol;
    });

    $('chain').textContent='🌈 虹の奇跡！';
  }

  // ワイルドの祝福
  if(
    lv(22)&&
    spin%5===0
  ){
    const pool=[
      ...Array(25).keys()
    ].sort(
      ()=>Math.random()-.5
    ).slice(0,2*lv(22));

    pool.forEach(i=>{
      g[i].s='w';
    });

    $('chain').textContent=
      '🌟 ワイルドの祝福！';
  }

  // 敗者復活
  if(
    lv(21)&&
    !matches(g).length&&
    Math.random()<.25*lv(21)
  ){
    const r=rnd(5);
    const c=rnd(3);
    const s=pickSymbol();

    for(let j=0;j<3;j++){
      g[r*5+c+j].s=s;
    }

    $('chain').textContent='🛟 敗者復活！';
  }

  return g;
}

// 当たりが消えたあと落下と補充
function cascadeRefill(removed,chain){
  for(let c=0;c<5;c++){
    const left=[];

    for(let r=4;r>=0;r--){
      const i=r*5+c;

      if(!removed.has(i)){
        left.push({...board[i]});
      }
    }

    for(let r=4;r>=0;r--){
      const i=r*5+c;

      board[i]=
        left[4-r]||
        makeTile({chain});

      if(!left[4-r]){
        // 新しく降ってきた絵柄のみコピー
        if(
          c>0&&
          Math.random()<.08*lv(6)
        ){
          board[i].s=board[i-1].s;
        }else if(
          r<4&&
          Math.random()<.08*lv(7)
        ){
          board[i].s=board[i+5].s;
        }
      }
    }
  }
}

// 当たりの位置に得点を表示
function floating(match,value){
  const center=match.idx.reduce(
    (a,i)=>{
      const rect=
        cellEls[i].getBoundingClientRect();

      const parent=
        $('machine').getBoundingClientRect();

      return {
        x:a.x+(
          rect.left+rect.width/2-
          parent.left
        )/match.idx.length,
        y:a.y+(
          rect.top+rect.height/2-
          parent.top
        )/match.idx.length
      };
    },
    {x:0,y:0}
  );

  const e=document.createElement('div');

  e.className='float';
  e.style.left=center.x+'px';
  e.style.top=center.y+'px';
  e.textContent='+'+num(value);

  $('machine').appendChild(e);

  setTimeout(()=>{
    e.remove();
  },580);
}

// 回転終了時に大きな合計を表示
function totalPopup(score,chain){
  const e=document.createElement('div');

  e.className='totalOverlay';

  e.innerHTML=`
    <div class="kicker">TURN SCORE</div>
    <div class="big">+${num(score)}</div>
    <div class="details">
      ${chain?chain+' CHAIN!':'NEXT SPIN!'}
    </div>
  `;

  $('machine').appendChild(e);

  setTimeout(()=>{
    e.remove();
  },fast?340:1080);
}

// モーダル
function close(){
  $('overlay').classList.add('hidden');
  render();
}

function dialog(html){
  $('dialog').innerHTML=html;
  $('overlay').classList.remove('hidden');
  render();
}

// 強化3択
function threeUpgrades(){
  const selected=[];

  for(const category of [
    '運',
    '得点',
    '連鎖'
  ]){
    const options=UP.filter(
      p=>
        p[4]===category&&
        lv(p[0])<p[5]&&
        !selected.includes(p)
    );

    if(options.length){
      selected.push(
        options[rnd(options.length)]
      );
    }
  }

  return selected;
}

function showUpgrade(){
  const options=threeUpgrades();

  if(!options.length){
    state.upgrades++;
    save();
    return afterSpin();
  }

  dialog(`
    <div class="sub">UPGRADE UNLOCKED</div>
    <h2>⚡ 強化を選ぼう！</h2>
    <p>
      運を上げる？
      得点を伸ばす？
      連鎖を狙う？
    </p>
    <div id="choices"></div>
  `);

  for(const item of options){
    const b=document.createElement('button');

    b.className='upgrade';

    b.innerHTML=`
      <span class="emoji">
        ${item[1]}
      </span>
      <span>
        <span class="category">
          ${item[4]}系
        </span>
        <strong>
          ${item[2]}
          <span style="font-size:11px;color:#bfff6b">
            Lv.${lv(item[0])+1}
          </span>
        </strong>
        <small>
          ${item[3]}（1レベルごと）
        </small>
      </span>
    `;

    b.onclick=()=>{
      if(busy)return;

      state.powers[item[0]]=
        lv(item[0])+1;

      state.upgrades++;

      save();
      close();

      beep(
        700,.16,'triangle',.07
      );
      beep(
        1050,.2,'sine',.05,.1
      );

      $('chain').textContent=
        item[1]+' '+item[2]+' 強化！';

      afterSpin();
    };

    $('choices').appendChild(b);
  }
}

function afterSpin(){
  if(busy)return;

  if(state.spins>=100){
    finish();
    return;
  }

  if(
    state.score>=
    nextGoal(state.upgrades)
  ){
    showUpgrade();
    return;
  }

  render();
}

// 100回転終了
function finish(){
  dialog(`
    <div class="sub">100 SPINS FINISHED</div>
    <h2>🏆 FINISH!</h2>
    <p>100回転おつかれ！</p>

    <div class="label">
      FINAL SCORE
    </div>
    <div class="score" style="color:#ffdf78">
      ${num(state.score)}
    </div>

    <p>
      最高連鎖：${state.maxChain} CHAIN<br>
      最高1回転：${num(state.bestTurn)}点<br>
      獲得した強化：${state.upgrades}回<br>
      自己ベスト：${num(state.best)}点
    </p>

    <button class="primary" id="again">
      もう一度100回転！
    </button>
  `);

  $('again').onclick=restart;
}

// スロット本体
async function spin(){
  if(
    busy||
    state.spins>=100||
    !$('overlay').classList.contains('hidden')
  )return;

  busy=true;
  render();

  const thisSpin=state.spins+1;

  $('chain').className='chainBox';
  $('chain').textContent='リール回転中…';

  const finalGrid=rollGrid(thisSpin);

  const stopped=[
    false,false,false,false,false
  ];

  cellEls.forEach(e=>{
    e.className='cell spinny';
  });

  beep(
    140,.2,'sawtooth',.06
  );

  // 回転中の絵柄
  const ticker=setInterval(()=>{
    for(let i=0;i<25;i++){
      if(!stopped[i%5]){
        cellEls[i].textContent=
          ICON[rnd(6)];
      }
    }
  },65);

  // 左から1列ずつ停止
  for(let c=0;c<5;c++){
    await sleep(c===0?340:240);

    stopped[c]=true;

    for(let r=0;r<5;r++){
      const i=r*5+c;

      cellEls[i].textContent=
        symLabel(finalGrid[i].s);

      cellEls[i].className=
        'cell'+
        (finalGrid[i].gold?' gold':'');
    }

    beep(
      220+c*58,
      .1,
      'triangle',
      .072
    );

    vibrate(20);
  }

  clearInterval(ticker);

  board=finalGrid;
  drawGrid();

  await sleep(180);

  let turnTotal=0;
  let chain=0;
  let revived=false;

  // 1回転の連鎖処理
  while(chain<18){
    let hits=matches(board);

    if(!hits.length){

      // 不滅：1回だけ再抽選
      if(
        chain>0&&
        !revived&&
        lv(20)&&
        Math.random()<.15*lv(20)
      ){
        revived=true;

        $('chain').textContent=
          '♾️ 不滅！ 6マス再抽選！';

        const spots=[
          ...Array(25).keys()
        ].sort(
          ()=>Math.random()-.5
        ).slice(0,6);

        spots.forEach(i=>{
          board[i]=makeTile({
            chain:chain+1
          });
        });

        drawGrid(true);

        beep(
          740,.22,'sine',.05
        );

        await sleep(420);
        continue;
      }

      break;
    }

    chain++;

    state.maxChain=Math.max(
      chain,
      state.maxChain
    );

    const mult=Math.min(
      512,
      Math.pow(
        2+.4*lv(19),
        chain-1
      )
    );

    $('chain').textContent=
      `${chain} CHAIN! ×${Number(mult.toFixed(1))}`;

    $('chain').className=
      'chainBox'+
      (chain>=3?' hot':'');

    if(chain>=3){
      beep(
        450+Math.min(8,chain)*75,
        .22,
        'sawtooth',
        .06
      );

      vibrate([40,25,50]);
    }

    if(chain>=5){
      flash();
      confetti(chain>=8?35:15);
    }

    const removed=new Set();

    // 当たりごとに加点演出
    for(const hit of hits){
      const value=pay(
        hit,
        board,
        chain
      );

      hit.idx.forEach(i=>{
        removed.add(i);
        cellEls[i].classList.add('match');
      });

      floating(hit,value);

      state.score=clamp(
        state.score+value
      );

      turnTotal=clamp(
        turnTotal+value
      );

      $('score').textContent=
        num(state.score);

      beep(
        400+Math.min(12,chain)*55,
        .12,
        'triangle',
        .05
      );

      await sleep(
        hits.length>=12?85:
        hits.length>=6?135:240
      );

      hit.idx.forEach(i=>{
        cellEls[i].classList.remove('match');
      });
    }

    // 爆弾の周囲を消す
    const explosions=[
      ...removed
    ].filter(
      i=>board[i].s==='b'
    );

    for(const i of explosions){
      const r=Math.floor(i/5);
      const c=i%5;

      for(let dr=-1;dr<=1;dr++){
        for(let dc=-1;dc<=1;dc++){
          const rr=r+dr;
          const cc=c+dc;

          if(
            rr>=0&&rr<5&&
            cc>=0&&cc<5
          ){
            removed.add(rr*5+cc);
          }
        }
      }
    }

    if(explosions.length){
      $('chain').textContent+=' 💣 BOOM!';

      flash();

      beep(
        120,.28,'sawtooth',.075
      );
    }

    // 当たりマスを消去
    for(const i of removed){
      cellEls[i].classList.add('clear');
    }

    await sleep(230);

    // 重力で落下・補充
    cascadeRefill(
      removed,
      chain+1
    );

    drawGrid(true);

    await sleep(360);
  }

  // 連鎖終了
  if(chain>=4){
    beep(
      523,.17,'sawtooth',.07
    );

    beep(
      784,.24,'sawtooth',.08,.10
    );
  }

  if(chain>=6){
    flash();
    confetti(70);
  }

  state.spins++;

  state.best=Math.max(
    state.best,
    state.score
  );

  state.bestTurn=Math.max(
    state.bestTurn,
    turnTotal
  );

  // 回転合計を大きく表示
  totalPopup(
    turnTotal,
    chain
  );

  $('chain').className=
    'chainBox'+
    (chain>=3?' hot':'');

  $('chain').textContent=chain?
    `${chain} CHAIN!　合計 +${num(turnTotal)}`:
    '次はそろうかな？';

  save();
  render();

  await sleep(1050);

  busy=false;

  afterSpin();
}

// リスタート
function restart(){
  const best=state.best;

  state=fresh();
  state.best=best;

  board=fillNewGrid();

  save();
  close();
  drawGrid();

  $('chain').className='chainBox';
  $('chain').textContent=
    'SPINして連鎖を起こせ！';

  render();
}

// 盤面を作成
for(let i=0;i<25;i++){
  const e=document.createElement('div');

  e.className='cell';

  $('board').appendChild(e);
  cellEls.push(e);
}

// セーブデータから復帰
if(
  Array.isArray(state.board)&&
  state.board.length===25&&
  state.board.every(
    x=>x&&[
      'w','b',0,1,2,3,4,5
    ].includes(x.s)
  )
){
  board=state.board.map(
    x=>({
      s:x.s,
      gold:!!x.gold
    })
  );
}else{
  board=fillNewGrid();
  save();
}

drawGrid();
render();

// イベント登録
$('spin').onclick=()=>{
  spin().catch(err=>{
    console.error(err);

    busy=false;
    drawGrid();
    render();

    $('chain').textContent=
      'エラーが発生しました。再開できます';
  });
};

$('sound').onclick=()=>{
  mute=!mute;

  try{
    localStorage.setItem(
      SAVE_KEY+'_mute',
      mute?'1':'0'
    );
  }catch(e){}

  render();

  if(!mute){
    beep(600);
  }
};

$('speed').onclick=()=>{
  fast=!fast;

  try{
    localStorage.setItem(
      SAVE_KEY+'_fast',
      fast?'1':'0'
    );
  }catch(e){}

  render();
};

$('reset').onclick=()=>{
  if(
    !busy&&
    confirm(
      '100回転を最初からやり直す？ 自己ベストは残すで。'
    )
  ){
    restart();
  }
};

setTimeout(afterSpin,70);

})();
</script>
