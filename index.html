<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#332a22">
<title>薪割り。</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#332a22}
  body{display:flex;justify-content:center;touch-action:none}
  canvas{display:block;width:min(100vw,480px);height:100dvh;touch-action:none;cursor:pointer}
</style>
</head>
<body>
<canvas id="game" aria-label="画面をタップして薪を割るゲーム"></canvas>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const W=400;
let H=760,scale=1;
let total=0;
try{total=Math.max(0,Number(localStorage.getItem('makiwari_total'))||0)}catch(e){}
let stacked=total,mode='drop',clock=0,hit=false,queued=0;
let pieces=[],dust=[],last=0,sound=null,woodTone=.5;
const rand=n=>{let t=Math.sin(n*127.1+78.233)*43758.5453;return t-Math.floor(t)};
const mix=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=t=>1-Math.pow(1-clamp(t),3);
function resize(){
 const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);
 scale=r.width/W;H=r.height/scale;
 ctx.setTransform(d*scale,0,0,d*scale,0,0);
}
window.addEventListener('resize',resize);resize();
function path(points){ctx.beginPath();ctx.moveTo(...points[0]);for(let i=1;i<points.length;i++)ctx.lineTo(...points[i]);ctx.closePath()}
function line(x1,y1,x2,y2,color,width=1){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function ellipse(x,y,rx,ry,color){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}
function cabin(){
 let g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,'#d0b89a');g.addColorStop(.78,'#947b61');g.addColorStop(1,'#614a39');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // 山小屋の木壁
 for(let y=-20,i=0;y<H*.74;y+=48,i++){
  ctx.fillStyle=i%2?'#b89e80':'#baa184';ctx.globalAlpha=.27;ctx.fillRect(0,y+2,W,46);ctx.globalAlpha=1;
  line(0,y+47,W,y+47,'#80654e99',2);
  line(0,y+44,W,y+44,'#f4d8b44d',1);
  for(let j=0;j<5;j++){
   let px=rand(i*13+j)*380,py=y+8+rand(i*29+j)*32;
   line(px,py,px+20+rand(i+j)*45,py-.5,'#72564228',1);
  }
 }
 // 柱
 ctx.fillStyle='#82634b';ctx.fillRect(0,0,19,H*.8);ctx.fillRect(380,0,20,H*.8);
 line(17,0,17,H*.8,'#e5bf9180',2);
 // 窓越しの山と空
 const wx=31,wy=H*.14,ww=151,wh=184;
 ctx.fillStyle='#70543e';ctx.fillRect(wx-8,wy-8,ww+16,wh+16);
 let sky=ctx.createLinearGradient(0,wy,0,wy+wh);
 sky.addColorStop(0,'#a7bdbe');sky.addColorStop(1,'#e3d4bc');
 ctx.fillStyle=sky;ctx.fillRect(wx,wy,ww,wh);
 path([[wx,wy+105],[wx+35,wy+64],[wx+57,wy+90],[wx+85,wy+48],[wx+ww,wy+113],[wx+ww,wy+wh],[wx,wy+wh]]);
 ctx.fillStyle='#7c9b98';ctx.fill();
 path([[wx,wy+135],[wx+54,wy+94],[wx+92,wy+119],[wx+131,wy+82],[wx+ww,wy+114],[wx+ww,wy+wh],[wx,wy+wh]]);
 ctx.fillStyle='#55746c';ctx.fill();
 for(let i=0;i<16;i++){
  const x=wx+(i*29)%ww,y=wy+135+rand(i)*22,h=24+rand(i+33)*35;
  path([[x-7,y],[x,y-h],[x+7,y],[x,y-5]]);ctx.fillStyle='#3e6254';ctx.fill();
 }
 ctx.fillStyle='#785c43';ctx.fillRect(wx+ww/2-4,wy,8,wh);ctx.fillRect(wx,wy+wh/2-4,ww,8);
 ctx.strokeStyle='#d0ab80';ctx.lineWidth=4;ctx.strokeRect(wx-3,wy-3,ww+6,wh+6);
 line(wx+9,wy+7,wx+35,wy+61,'#ffffff22',9);
 // 右側の壁の控えめな小物
 line(273,H*.24,358,H*.24,'#6e5444',7);
 ctx.fillStyle='#8a6c4e';ctx.fillRect(293,H*.195,20,H*.04);
 ctx.fillStyle='#aa8560';ctx.fillRect(319,H*.207,25,H*.027);
 line(342,H*.30,342,H*.40,'#77604c',2);
 // 柔らかい窓の光
 ctx.globalAlpha=.13;
 path([[wx+ww,wy+wh],[192,wy+wh],[370,H*.71],[210,H*.71]]);
 ctx.fillStyle='#fff3d2';ctx.fill();ctx.globalAlpha=1;
 // 床
 let floor=H*.72;
 ctx.fillStyle='#80634e';ctx.fillRect(0,floor,W,H-floor);
 for(let i=0;i<8;i++){
  let y=floor+Math.pow(i/8,1.5)*(H-floor);
  line(0,y,W,y,'#4a352851',2);
  line(0,y+3,W,y+3,'#d1af8244',1);
 }
 for(let i=-3;i<=6;i++)line(200+i*19,floor,200+i*120,H,'#4f3b3040',2);
 const shade=ctx.createRadialGradient(170,H*.53,90,200,H*.54,H*.75);
 shade.addColorStop(0,'#00000000');shade.addColorStop(1,'#26190d56');
 ctx.fillStyle=shade;ctx.fillRect(0,0,W,H);
}
function pilePiece(x,y,id){
 const v=rand(id+31),angle=(rand(id*17+7)-.5)*.26;
 ctx.save();ctx.translate(x,y);ctx.rotate(angle);
 ctx.fillStyle='#4d392a44';ctx.beginPath();ctx.ellipse(2,5,13,6,0,0,7);ctx.fill();
 path([[-12,-6],[7,-10],[14,-3],[12,9],[-10,8]]);
 ctx.fillStyle=['#946d4c','#a77a52','#bd9060'][Math.floor(v*3)];ctx.fill();
 ctx.strokeStyle='#634932';ctx.lineWidth=1;ctx.stroke();
 path([[-11,-6],[6,-9],[8,5],[-10,7]]);
 ctx.fillStyle=['#dfb989','#e5c291','#cda475'][Math.floor(v*3)];ctx.fill();
 line(-8,-2,3,-4,'#a98158',.8);
 line(-8,3,4,1,'#b48a5f',.8);
 ctx.restore();
}
function pile(){
 // 各薪は2片になって積まれる。表示上は山の見える部分だけ描画。
 const n=Math.min(Math.floor(stacked)*2,242),cols=11;
 for(let i=0;i<n;i++){
  let row=Math.floor(i/cols),col=i%cols;
  let order=[2,7,1,8,3,6,0,9,4,5,10];
  let x=69+order[col]*26+(row%2)*4+(rand(i+100)-.5)*6;
  let y=H*.718-row*13+(rand(i+200)-.5)*6;
  pilePiece(x,y,i);
 }
}
function stump(){
 const y=H*.775,x=198;
 ellipse(x+5,y+91,90,20,'#241a1449');
 const bark=ctx.createLinearGradient(128,0,270,0);
 bark.addColorStop(0,'#5c402d');bark.addColorStop(.3,'#98704a');bark.addColorStop(.65,'#a47c51');bark.addColorStop(1,'#513c2c');
 path([[130,y],[266,y],[260,y+88],[242,y+101],[148,y+95],[135,y+85]]);
 ctx.fillStyle=bark;ctx.fill();
 ctx.strokeStyle='#58412d';ctx.lineWidth=2;ctx.stroke();
 for(let i=0;i<21;i++){
  let x1=138+rand(i+71)*117;
  line(x1,y+13+rand(i+92)*15,x1+(rand(i+83)-.5)*12,y+65+rand(i+33)*24,i%2?'#4a34285c':'#e3b78336',1+rand(i)*2);
 }
 ellipse(x,y,72,23,'#654a34');
 ellipse(x,y-2,68,20,'#d4aa78');
 ellipse(x+1,y-2,56,16,'#e3bc88');
 ctx.strokeStyle='#b58a5c';ctx.lineWidth=1.5;
 for(let r=16;r<=49;r+=12){ctx.beginPath();ctx.ellipse(x,y-2,r,r*.265,-.05,0,7);ctx.stroke()}
 line(x+3,y-4,x+43,y+2,'#936c47',1.3);
}
function logAt(x,bottom,drop=1){
 const top=bottom-96,w=57;
 ctx.save();ctx.translate(x,bottom);
 let g=ctx.createLinearGradient(-w/2,0,w/2,0);
 g.addColorStop(0,'#785536');g.addColorStop(.22,'#a57a4b');g.addColorStop(.65,'#bd9061');g.addColorStop(1,'#694c32');
 path([[-27,-91],[-29,-7],[-23,1],[25,0],[29,-7],[26,-91]]);
 ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='#65462f';ctx.lineWidth=2;ctx.stroke();
 for(let i=0;i<12;i++){
  let bx=-24+rand(i*7+3)*48;
  ctx.strokeStyle=i%2?'#5d412b88':'#e1b58777';ctx.lineWidth=1+rand(i)*1.6;
  ctx.beginPath();ctx.moveTo(bx,-83+rand(i*21)*8);
  ctx.bezierCurveTo(bx-5,-59,bx+7,-35,bx+(rand(i+41)-.5)*8,-7);ctx.stroke();
 }
 ellipse(0,-92,28,10,'#64472f');
 ellipse(0,-94,26,9,'#deb480');
 ctx.strokeStyle='#af865a';ctx.lineWidth=1;
 for(let r=7;r<25;r+=7){ctx.beginPath();ctx.ellipse(0,-94,r,r*.33,0,0,7);ctx.stroke()}
 line(-3,-95,11,-92,'#906642',1);
 ctx.restore();
}
function half(x,y,side,rotation,sz=1){
 ctx.save();ctx.translate(x,y);ctx.rotate(rotation);ctx.scale(sz,sz);
 path([[0,-47],[side*28,-43],[side*29,38],[side*7,46],[0,35]]);
 ctx.fillStyle='#976f4d';ctx.fill();ctx.strokeStyle='#664b34';ctx.lineWidth=2;ctx.stroke();
 path([[0,-47],[side*12,-45],[side*11,40],[0,35]]);
 ctx.fillStyle='#e2b986';ctx.fill();
 for(let j=0;j<4;j++)line(side*4,-34+j*18,side*(7+rand(j+side+10)*3),-25+j*16,'#b98e5e',1);
 ctx.restore();
}
function drawSplits(){
 for(const p of pieces){
  let t=clamp(p.age/.53),e=ease(t);
  let dest=H*.718-Math.floor(Math.min(stacked*2,242)/11)*13-5;
  let x=mix(198,p.side<0?129:260,e);
  let y=mix(H*.775-52,dest,e)-Math.sin(t*Math.PI)*72;
  half(x,y,p.side,p.side*(-.28-1.5*e),1-.55*e);
 }
 for(const p of dust){
  ctx.globalAlpha=clamp(1-p.age/p.life)*.8;
  ctx.fillStyle=p.color;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle+p.age*3);
  ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*.6);ctx.restore();
 }
 ctx.globalAlpha=1;
}
function axe(progress=0){
 // 刃は画面右から入り、薪の中央に向かって振り下ろされる。
 let t=progress<.38?ease(progress/.38):1-ease((progress-.38)/.62);
 t=clamp(t);
 const y=H*.775;
 const hx=mix(335,201,t),hy=mix(y-202,y-87,t);
 ctx.save();ctx.translate(hx,hy);ctx.rotate(-.06+t*.11);
 ctx.lineCap='round';
 // 木の柄
 ctx.strokeStyle='#483323';ctx.lineWidth=18;
 ctx.beginPath();ctx.moveTo(6,2);ctx.lineTo(88,-142);ctx.stroke();
 ctx.strokeStyle='#ad8156';ctx.lineWidth=13;
 ctx.beginPath();ctx.moveTo(6,2);ctx.lineTo(88,-142);ctx.stroke();
 line(10,-2,90,-143,'#d7aa7580',2.4);
 // 金属の斧頭
 const metal=ctx.createLinearGradient(-51,0,20,0);
 metal.addColorStop(0,'#e0e2dd');metal.addColorStop(.5,'#87908e');metal.addColorStop(1,'#56605f');
 path([[-46,9],[-36,-20],[-4,-26],[16,-17],[19,14],[-6,19],[-35,22]]);
 ctx.fillStyle=metal;ctx.fill();ctx.strokeStyle='#56605a';ctx.lineWidth=1.5;ctx.stroke();
 line(-42,7,-34,-17,'#fff8eb99',2);
 ctx.restore();
}
function textUI(){
 ctx.textBaseline='middle';ctx.fillStyle='#f6ebd8';
 ctx.shadowColor='#281a14aa';ctx.shadowBlur=8;
 ctx.font='500 21px system-ui,-apple-system,sans-serif';ctx.textAlign='left';ctx.fillText('薪割り。',22,39);
 ctx.textAlign='right';ctx.font='500 21px system-ui,-apple-system,sans-serif';
 ctx.fillText(total.toLocaleString('ja-JP')+' 本',378,39);
 ctx.shadowBlur=0;
 if(total===0){
  ctx.fillStyle='#f8e8d1';ctx.textAlign='center';ctx.font='15px system-ui,sans-serif';
  ctx.shadowColor='#24160e';ctx.shadowBlur=8;
  ctx.fillText('画面をタップして薪を割る',200,H-45);ctx.shadowBlur=0;
 }
}
function chopSound(){
 try{
  const A=window.AudioContext||window.webkitAudioContext;if(!A)return;
  if(!sound)sound=new A();if(sound.state==='suspended')sound.resume();
  let start=sound.currentTime;
  const osc=sound.createOscillator(),gain=sound.createGain();
  osc.type='triangle';osc.frequency.setValueAtTime(150,start);
  osc.frequency.exponentialRampToValueAtTime(62,start+.11);
  gain.gain.setValueAtTime(.22,start);gain.gain.exponentialRampToValueAtTime(.001,start+.16);
  osc.connect(gain);gain.connect(sound.destination);osc.start(start);osc.stop(start+.17);
  const len=Math.floor(sound.sampleRate*.12),buf=sound.createBuffer(1,len,sound.sampleRate),data=buf.getChannelData(0);
  for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
  const noise=sound.createBufferSource(),filter=sound.createBiquadFilter(),g=sound.createGain();
  noise.buffer=buf;filter.type='lowpass';filter.frequency.value=1700;g.gain.value=.3;
  noise.connect(filter);filter.connect(g);g.connect(sound.destination);noise.start(start);noise.stop(start+.12);
 }catch(e){}
}
function beginChop(){mode='chop';clock=0;hit=false;chopSound()}
function onTap(e){
 e.preventDefault();
 if(mode==='ready')beginChop();else queued=Math.min(queued+1,3);
}
canvas.addEventListener('pointerdown',onTap);
window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();if(!e.repeat)onTap(e)}});
function impact(){
 hit=true;total++;try{localStorage.setItem('makiwari_total',String(total))}catch(e){}
 pieces=[{side:-1,age:0},{side:1,age:0}];
 for(let i=0;i<16;i++){
  let a=rand(i+total*13)*Math.PI*2,sp=30+rand(i+total*39)*130;
  dust.push({x:198,y:H*.775-85,vx:Math.cos(a)*sp,vy:-40-Math.abs(Math.sin(a))*sp,
   age:0,life:.35+rand(i+total)*.45,size:2+rand(i*3+total)*5,angle:a,
   color:i%3?'#b8895d':'#e5be86'});
 }
}
function update(dt){
 clock+=dt;
 if(mode==='drop'&&clock>=.31){mode='ready';clock=0}
 if(mode==='chop'){
  if(!hit&&clock>=.15)impact();
  if(clock>=.49){mode='drop';clock=0;woodTone=rand(total+1)}
 }
 for(const p of pieces)p.age+=dt;
 if(pieces.length&&pieces.every(p=>p.age>=.53)){pieces=[];stacked=total}
 for(const p of dust){p.age+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=350*dt}
 dust=dust.filter(p=>p.age<p.life);
 if(mode==='ready'&&queued>0){queued--;beginChop()}
}
function frame(t){
 let dt=last?Math.min((t-last)/1000,.05):0;last=t;
 update(dt);
 ctx.clearRect(0,0,W,H);
 cabin();pile();drawSplits();stump();
 if(mode!=='chop'||!hit){
  let y=H*.775;
  if(mode==='drop')y=mix(-15,H*.775,ease(clamp(clock/.31)));
  logAt(198,y);
 }
 axe(mode==='chop'?clamp(clock/.40):0);
 textUI();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
