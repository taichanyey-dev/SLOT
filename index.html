<html lang="ja">
<head>

<style>

html,body{margin:0;min-height:100%;background:#0c101d;color:var(--ink);font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN',Meiryo,sans-serif}
body{background:radial-gradient(ellipse at top,#29264e 0%,#0c101d 65%)}
button{font:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid #fff;outline-offset:3px}

.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-size:25px;letter-spacing:-1.4px;font-weight:1000}
.brand b{color:var(--lime)}
.eyebrow{font-size:10px;color:var(--muted);letter-spacing:2px;font-weight:800}
.quiet{color:var(--muted)}
.iconbtn{background:#252c42;border:1px solid var(--edge);color:white;border-radius:12px;width:42px;height:41px;font-size:18px}
.stats{background:linear-gradient(145deg,#252a45,#171d30);border:1px solid var(--edge);border-radius:18px;padding:14px}
.score{font-size:clamp(34px,10vw,45px);font-weight:1000;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.best{text-align:right;font-size:11px;color:var(--muted)}
.best strong{display:block;color:#fff;font-size:16px}
.bar{height:11px;border-radius:30px;overflow:hidden;background:#39415d;margin:9px 0 7px}
.bar>div{height:100%;background:linear-gradient(90deg,#6ae7b5,var(--lime));width:0;transition:width .2s}
.sm{font-size:12px;font-weight:800}
.machine{border:2px solid #585878;background:linear-gradient(155deg,#33394f,#1a2032 65%,#302b46);border-radius:23px;padding:12px 9px;box-shadow:0 8px 0 #080a12,0 14px 26px #0008;position:relative;isolation:isolate}
.machine-title{font-size:11px;text-align:center;letter-spacing:3px;font-weight:1000;color:var(--gold);padding-bottom:10px}
.reels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.cell{aspect-ratio:1/1.03;display:grid;place-items:center;min-width:0;background:linear-gradient(#fff,#dfe5f0 50%,#fff);border:2px solid #c1cade;border-radius:9px;font-size:clamp(24px,8vw,39px);line-height:1;color:#111c30;user-select:none;box-shadow:inset 0 0 11px #8d98b6aa,0 2px #0b0e1b}
.cell.hit{background:#fff1a3;border-color:#ffc944;box-shadow:0 0 13px #ffcb4f,inset 0 0 12px #ffcf61}
.cell.rolling{filter:blur(1px);animation:shake .09s infinite}
@keyframes shake{50%{transform:translateY(4px)}}
.cell.land{animation:land .28s cubic-bezier(.1,.9,.3,1.25)}
@keyframes land{
0%{transform:translateY(-13px) scale(.96);filter:brightness(1.5)}
65%{transform:translateY(3px) scale(1.07)}
100%{transform:none}
}
.cell.focus{position:relative;z-index:2;background:#fff2a0;border-color:#fff66a;box-shadow:0 0 20px #ffe34c,0 0 8px #fff,inset 0 0 15px #f7ac48;animation:hitPulse .42s ease-in-out infinite alternate}
@keyframes hitPulse{
from{transform:scale(1.02);filter:brightness(1)}
to{transform:scale(1.09);filter:brightness(1.25)}
}
.cell.seen{background:#fff5c9;border-color:#f3d171}
.win-float{position:absolute;z-index:7;left:0;right:0;top:44%;text-align:center;pointer-events:none;color:#fffbd3;font-size:clamp(19px,7vw,31px);font-weight:1000;text-shadow:0 3px #ec528b,0 0 18px #ffa800;animation:winFly .5s both}
@keyframes winFly{
0%{transform:translateY(18px) scale(.65);opacity:0}
25%{transform:translateY(0) scale(1.15);opacity:1}
75%{opacity:1}
100%{transform:translateY(-14px) scale(1);opacity:0}
}
.message{height:38px;display:grid;place-items:center;text-align:center;font-size:15px;font-weight:1000;color:#dbe1ef}
.message.win{color:var(--lime)}
.message.mega{color:var(--gold);text-shadow:0 0 13px #eec959}
.spin{width:100%;height:70px;border:0;border-radius:18px;color:#13201a;background:linear-gradient(130deg,#d3ff72,#7bf6a8);font-size:27px;font-weight:1000;letter-spacing:2px;box-shadow:0 6px #387f57,0 11px 20px #0008}
.spin:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px #387f57}
.spin:disabled{opacity:.5;filter:grayscale(.7)}
.box{border:1px solid #303952;background:#181e30;border-radius:14px;padding:11px}
.chips,.events{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.chip{font-size:11px;border-radius:7px;background:#303a53;padding:5px 7px;font-weight:800}
.event{font-size:10px;color:#ffdf8c;border-radius:7px;border:1px solid #665439;background:#382b24;padding:4px 6px}

.rule{text-align:center;margin:0;font-size:11px;line-height:1.5;color:#b4bdd2}
.link{border:0;background:none;color:#afb9d5;text-decoration:underline;padding:7px}
.footer{margin-top:auto;font-size:11px}
.overlay{position:fixed;z-index:30;inset:0;background:#080a15e9;display:grid;place-items:center;backdrop-filter:blur(8px);padding:16px}
.overlay.hidden{display:none}

.modal p{font-size:12px;color:#c1ccdf;line-height:1.7;margin:8px 0 16px}

.tier-1{color:#71b7ff}
.tier-2{color:#c99aff}
.tier-3{color:#ffe080}
.tier-4{color:#ff91ba}
.primary{border:0;width:100%;border-radius:14px;background:var(--lime);font-size:18px;font-weight:1000;padding:14px;color:#19211b}
.flash{position:fixed;inset:0;pointer-events:none;z-index:9;background:#fff2a9;opacity:0;transition:opacity .2s}
.flash.on{opacity:.33;transition:none}
.confetti{position:fixed;z-index:11;top:-3vh;left:var(--x);width:8px;height:13px;background:var(--c);pointer-events:none;animation:fall var(--t) linear forwards;animation-delay:var(--d)}
@keyframes fall{
to{transform:translate(var(--dx),105vh) rotate(800deg);opacity:.4}
}
@media(max-height:740px){
.app{gap:9px}
.stats{padding:11px}
.machine{padding:9px}
.message{height:32px}
.spin{height:59px}
}
@media(prefers-reduced-motion:reduce){
.rolling,.confetti,.cell.land,.cell.focus,.win-float{animation:none!important}
}
</style>
</head>

 chestOpened:false,prophecy:-1,prophecyEnd:0,
 rainbow:false,heist:0,contractAt:-1,
 bestTurn:0,godUsed:false,events:[],pending:0
});

let d=fresh(),busy=false,muted=false,ac=null,cells=[];

try{
 const v=JSON.parse(localStorage.getItem(SAVE));
 if(v&&Number.isInteger(v.spins)&&v.spins>=0&&v.spins<=100
 &&Number.isFinite(v.score)&&v.score>=0&&v.score<=CAP
 &&v.powers&&typeof v.powers==='object'){
   d={...fresh(),...v,
     virus:Array.isArray(v.virus)?v.virus:[0,0,0,0,0,0]};
 }
 muted=localStorage.getItem(SAVE+'_mute')==='1';
}catch(e){}

const save=()=>{
 try{localStorage.setItem(SAVE,JSON.stringify(d))}
 catch(e){}
};
const LV=id=>Math.max(0,Math.min(99,Number(d.powers[id])||0));
const has=id=>LV(id)>0;
const rand=n=>Math.floor(Math.random()*n);
const fmt=n=>Math.floor(n).toLocaleString('ja-JP');
const safe=n=>Math.max(0,Math.min(CAP,Math.round(Number.isFinite(n)?n:CAP)));
const sumLV=()=>Object.values(d.powers).reduce((a,b)=>a+(Number(b)||0),0);

function target(n){
 const t=210*(Math.pow(1.38,n+1)-1)/.38;
 return Math.max(210,Math.min(CAP,Math.round(t/10)*10));
}

function beep(f=440,t=.09,type='sine',v=.055,at=0){
 if(muted)return;
 try{
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  ac=ac||new AC();
  if(ac.state==='suspended')ac.resume().catch(()=>{});
  const o=ac.createOscillator();
  const g=ac.createGain();
  const s=ac.currentTime+at;
  o.type=type;
  o.frequency.setValueAtTime(f,s);
  g.gain.setValueAtTime(.0001,s);
  g.gain.exponentialRampToValueAtTime(Math.max(.001,v),s+.01);
  g.gain.exponentialRampToValueAtTime(.0001,s+t);
  o.connect(g);
  g.connect(ac.destination);
  o.start(s);
  o.stop(s+t+.01);
 }catch(e){}
}
function vibrate(p){
 try{navigator.vibrate?.(p)}catch(e){}
}
function song(big){
 (big?[523,659,784,987,1318,1568]:[440,554,659])
 .forEach((f,i)=>beep(f,.17,big?'sawtooth':'triangle',big?.058:.044,i*.085));
 vibrate(big?[75,35,95,35,145]:[25,25,60]);
}

function pick(){
 let w=WEIGHTS.slice();
 if(has(19))w[5]+=.5+(.15*d.spins);
 let total=w.reduce((a,b)=>a+b,0),v=Math.random()*total;
 for(let i=0;i<6;i++)if((v-=w[i])<0)return i;
 return 5;
}
function roll(){return Array.from({length:15},pick)}
function sign(v){return v===-1?'🌟':F[v]}

 const t=target(d.upgradeCount);
 const prev=d.upgradeCount?target(d.upgradeCount-1):0;

 $('best').textContent=fmt(Math.max(d.best,d.score));
 $('target').textContent=fmt(t)+' 点';
 $('remaining').textContent='達成まで '+fmt(Math.max(0,t-d.score));
 $('spins').textContent=d.spins+' / 100 SPINS';
 $('bar').style.width=Math.max(0,Math.min(100,
   100*(d.score-prev)/Math.max(1,t-prev)))+'%';
 $('upcount').textContent=d.upgradeCount;

 let s='連勝 '+d.streak;
 if(has(54))s+='　🕳️ '+fmt(d.blackhole);
 if(has(56))s+='　🎁 '+fmt(d.chest);
 if(has(55)&&d.prophecy>=0&&d.spins<d.prophecyEnd){
   s+='　🔮 '+F[d.prophecy];
 }
 $('status').textContent=s;

 let p=ITEMS.filter(x=>LV(x[0])).map(x=>
 `<span class="chip">${x[1]} ${x[2]} ${LV(x[0])>1?'Lv'+LV(x[0]):''}</span>`);

function eq(v,targetSym){
 if(v===-1||v===targetSym)return true;
 if(has(14)&&targetSym<=1&&v<=1)return true;
 if(has(15)&&[2,3].includes(targetSym)&&[2,3].includes(v))return true;
 return false;
}

function lineValue(sym,len,kind='line'){
 let p=PAY[sym]*(len===2?.24:len===3?1:len===4?3.5:9);
 if(kind==='square')p*=2.8;
 if(kind==='mirror')p*=1.8;
 if(kind==='step')p*=1.4;
 p*=1+.3*LV(0);
 p*=1+(len===3?.65*LV(61):len>=4?.75*LV(62):0);
 if(sym>=4)p*=1+.9*LV(63);
 if(sym===5)p*=1+.05*LV(34)*d.growing7;
 if(has(58))p*=1+(d.virus[sym]||0);
 if(len===5&&has(29))p*=5;
 return safe(p+35*LV(65));
}

function evaluate(g,opt={}){
 let payouts=[],used=new Set(),all=opt.god===true;

 function add(path,name,min=3,bonus=1,full=false){
  let best=null;
  for(let s=0;s<6;s++){
   let run=0;
   while(run<path.length&&eq(g[path[run]],s))run++;
   if(run<min||(name==='pair'&&run!==2)
     ||(full&&run!==path.length))continue;
   let value=lineValue(s,run,name)*bonus;
   if(!best||value>best.value){
     best={sym:s,len:run,value,idx:path.slice(0,run),name};
   }
  }
  if(best){
   payouts.push(best);
   best.idx.forEach(i=>used.add(i));
  }
 }

 for(const line of H){
   add(line,'line');
   if(has(7))add(line,'pair',2);
 }

 if(has(1)||has(10)||all){
  for(const line of H){
   add(line.slice().reverse(),'reverse',3,has(10)?2:1);
  }
 }
 if(has(2)||all){
  for(let c=0;c<5;c++){
   const p=[c,c+5,c+10];
   add(p,'vertical');
   if(has(10))add(p.slice().reverse(),'vertical reverse');
  }
 }
 if(has(3)||all){
  for(let c=0;c<3;c++){
   add([c,c+6,c+12],'cross');
   add([c+10,c+6,c+2],'cross');
   if(has(10)){
    add([c+12,c+6,c],'cross reverse');
    add([c+2,c+6,c+10],'cross reverse');
   }
  }
 }
 if(has(4)||all){
  for(let r=0;r<2;r++)for(let c=0;c<4;c++){
   add([r*5+c,r*5+c+1,(r+1)*5+c,(r+1)*5+c+1],
     'square',4,1,true);
  }
 }
 if(has(5)||all){
  for(let r=0;r<3;r++){
   const p=[r*5,r*5+2,r*5+4];
   add(p,'step',3,1,true);
   if(has(10))add(p.slice().reverse(),'step reverse',3,2,true);
  }
 }
 if(has(6)||all){
  for(let r=0;r<3;r++){
   let a=r*5;
   if(eq(g[a],g[a+4])&&eq(g[a+1],g[a+3])){
    let sym=g[a]>=0?g[a]:0;
    let v=lineValue(sym,3,'mirror');
    payouts.push({
      sym,len:3,value:v,
      idx:[a,a+1,a+2,a+3,a+4],name:'mirror'
    });
    [a,a+1,a+2,a+3,a+4].forEach(i=>used.add(i));
   }
  }
 }
 if(has(9)||all){
  for(let c=0;c<3;c++)for(let r=0;r<3;r++){
   for(const j of [-1,1]){
    const mid=r+j;
    if(mid<0||mid>2)continue;
    const p=[r*5+c,mid*5+c+1,r*5+c+2];
    add(p,'zigzag');
    if(has(10))add(p.slice().reverse(),'zigzag reverse',3,2);
   }
  }
 }

 let lineSum=payouts.reduce((a,b)=>a+b.value,0);
 if(has(25)&&g.filter(x=>x===2).length>=5)lineSum*=3;

 const count=s=>g.filter(x=>x===s).length;
 let bonuses=0;
 if(has(21)&&count(4)>=3)bonuses+=200*LV(21)*count(4);
 if(has(22)&&count(5)>=3)bonuses+=1500*LV(22);
 if(has(24)&&count(1)>=5)bonuses+=60*LV(24)*count(1);

 return {
  payouts,used,
  lineSum:safe(lineSum),bonuses:safe(bonuses),
  count,
  full5:payouts.filter(x=>x.len===5).length,
  maxLen:Math.max(0,...payouts.map(x=>x.len)),
  main:payouts.length
    ?payouts.reduce((a,b)=>a.value>=b.value?a:b).sym:-1,
  base:safe(lineSum+bonuses+15*LV(64))
 };
}

function addLog(log,text){
 if(log.length<22&&!log.includes(text))log.push(text);
}

function adjust(g,spin,log){
 if(has(12)&&d.sticky){
  g[d.sticky.i]=d.sticky.v;
  addLog(log,'🧊 粘着');
 }
 if(has(11)&&spin%3===0){
  g[rand(15)]=-1;
  addLog(log,'🃏 ワイルド');
 }
 if(has(16)){
  let n=0;
  for(let i=0;i<15;i++){
   if(g[i]===5&&Math.random()<.2){
    g[i]=-1;n++;
   }
  }
  if(n)addLog(log,'7️⃣ 七変化 ×'+n);
 }
 if(has(17)){
  for(let r=0;r<3;r++){
   let i=r*5;
   if(g[i]>=0&&g[i]===g[i+1]&&Math.random()<.25){
    g[i+2]=g[i];
    addLog(log,'🧲 マグネット');
   }
  }
 }
 return g;
}

function improve(g,log){
 let best=evaluate(g).base,idx=-1,sym=-1;
 for(let i=0;i<15;i++){
  for(let s=0;s<6;s++){
   if(g[i]===s)continue;
   let v=g[i];
   g[i]=s;
   let p=evaluate(g).base;
   g[i]=v;
   if(p>best){best=p;idx=i;sym=s}
  }
 }
 if(idx>=0){
  g[idx]=sym;
  addLog(log,'👁️ 神の指先');
 }
 return g;
}

function chooseGrid(spin,log){
 let g=adjust(roll(),spin,log);
 let god=false;

 if(has(60)&&!d.godUsed&&Math.random()<.01){
  god=true;
  g=Array(15).fill(rand(6));
  d.godUsed=true;
  addLog(log,'👁️ スロットの神');
 }
 if(has(51)&&spin%10===0&&!god){
  let alt=adjust(roll(),spin,log);
  if(evaluate(alt).base>evaluate(g).base)g=alt;
  addLog(log,'🌌 パラレル選択');
 }
 if(has(20)&&spin%10===0&&!god)improve(g,log);
 return {g,god};
}

// 66種類の強化を含めて得点を計算
function getSpin(g,god,spin,log){
 let z=evaluate(g,{god});
 let extraReveals=[];

 if(has(13)&&!z.payouts.length&&!god){
  for(let r=0;r<3;r++)g[r*5+4]=pick();
  z=evaluate(g);
  addLog(log,'🔁 敗者復活');
 }

 let original=0;
 if(has(18)&&z.payouts.some(p=>p.sym===3)){
  original=z.base;
  let next=new Set();
  for(const p of z.payouts){
   if(p.sym!==3)continue;
   for(const i of p.idx){
    let r=Math.floor(i/5),c=i%5;
    for(let dr=-1;dr<=1;dr++){
     for(let dc=-1;dc<=1;dc++){
      let rr=r+dr,cc=c+dc;
      if(rr>=0&&rr<3&&cc>=0&&cc<5){
       next.add(rr*5+cc);
      }
     }
    }
   }
  }
  for(const i of next)g[i]=3;
  z=evaluate(g,{god});
  addLog(log,'💣 爆弾で再配当');
 }

 let gain=safe(z.base+original);
 let realHit=z.payouts.length>0;
 let prevMiss=d.misses;
 let full=z.full5>0;
 let big=z.maxLen>=4;
 let highest=Math.max(0,...z.payouts.map(p=>p.value));
 let multiplier=1;

 if(realHit&&d.rainbow){
  multiplier*=3;
  d.rainbow=false;
  addLog(log,'🌈 レインボー3倍');
 }
 if(has(8)&&new Set(g.filter(x=>x>=0)).size===6){
  d.rainbow=true;
  addLog(log,'🌈 次回の当たり予告');
 }
 if(has(23)&&z.count(0)>=7){
  multiplier*=10;
  addLog(log,'🍒 チェリー祭り10倍');
 }
 if(has(25)&&z.count(2)>=5){
  addLog(log,'🍀 フィーバー3倍');
 }
 if(has(26)&&z.count(3)>=3&&Math.random()<.2){
  multiplier*=5;
  addLog(log,'🔔 共鳴5倍');
 }
 if(has(27)&&z.payouts.length>=2){
  multiplier*=2;
  addLog(log,'🎯 2ライン2倍');
 }
 if(has(28)&&z.payouts.length>=3){
  multiplier*=10;
  addLog(log,'👑 3ライン10倍');
 }
 if(has(30)&&z.full5>=2){
  multiplier*=100;
  addLog(log,'🌋 神の一撃100倍');
 }

 if(realHit&&has(31))multiplier*=1+.2*LV(31)*d.streak;
 if(realHit&&has(32)&&prevMiss){
  multiplier*=1+.5*LV(32)*prevMiss;
  addLog(log,'🥶 逆境 '+prevMiss+'連');
 }
 if(has(35))multiplier*=spin<=50?.5:3;
 if(has(36)&&spin>=91){
  multiplier*=3;
  addLog(log,'🚀 ラストスパート');
 }
 if(realHit&&has(37)&&d.charge>=10){
  multiplier*=10;
  d.charge=0;
  addLog(log,'🌋 火山10倍');
 }
 if(realHit&&has(38)&&z.main===d.lastSym&&d.sameSym>0){
  multiplier*=Math.min(32,1+d.sameSym);
  addLog(log,'🔗 同絵柄連鎖');
 }
 if(has(39)&&d.seen.length===6){
  multiplier*=2;
  addLog(log,'📚 全種コンプ2倍');
 }
 if(has(40))multiplier*=1+.25*Math.floor(sumLV()/10);
 if(has(43)){
  multiplier*=spin<=d.contractAt+10?.5:2;
  if(spin===d.contractAt+11)addLog(log,'💀 契約解放2倍');
 }
 if(has(48)&&big&&d.sinceBig>=10){
  multiplier*=20;
  addLog(log,'🧨 20倍解放');
 }
 if(big&&d.heist>0){
  multiplier*=Math.pow(10,Math.min(d.heist,4));
  d.heist=0;
  addLog(log,'💸 借金取り10倍');
 }
 if(has(55)&&d.prophecy>=0&&spin<=d.prophecyEnd
 &&z.payouts.some(p=>p.sym===d.prophecy)){
  multiplier*=20;
  d.prophecy=-1;
  addLog(log,'🔮 未来予知的中20倍');
 }

 if(realHit&&has(41)){
  if(Math.random()<.1){
   multiplier*=10;addLog(log,'🎲 10倍成功！');
  }else{
   multiplier=0;addLog(log,'🎲 失敗：0点');
  }
 }
 if(realHit&&has(42)){
  if(Math.random()<.5){
   multiplier*=2.5;addLog(log,'🪙 コイン成功');
  }else{
   multiplier=0;addLog(log,'🪙 コイン失敗');
  }
 }
 if(realHit&&has(49)){
  if(Math.random()<.2){
   multiplier*=8;addLog(log,'🎭 天国8倍');
  }else{
   multiplier=0;addLog(log,'🎭 地獄：0点');
  }
 }

 if(realHit&&has(44)){
  d.critical++;
  if(Math.random()<Math.min(.9,d.critical*.01)){
   multiplier*=30;
   d.critical=0;
   addLog(log,'☢️ 臨界爆発30倍');
  }
 }
 if(!realHit&&has(45)&&Math.random()<.005){
  gain+=10000;
  addLog(log,'🎰 裏ジャックポット！');
 }
 if(realHit&&has(46)&&Math.random()<.05){
  multiplier*=20;
  addLog(log,'⚡ 雷神20倍');
 }

 // 無限連鎖も当たり回数に応じて個別演出
 if(realHit&&has(53)){
  let extra=0,steps=0;
  for(const p of z.payouts){
   let j=0;
   while(j<20&&Math.random()<.3){
    extra+=p.value;
    extraReveals.push({...p,name:'chain'});
    j++;steps++;
   }
  }
  if(steps){
   gain+=extra;
   addLog(log,'🧬 無限連鎖 ×'+steps);
  }
 }

 if(full&&has(59)){
  let bonus=0,chains=0;
  for(const p of z.payouts.filter(p=>p.len===5)){
   let v=p.value*2,j=0;
   while(j<12&&Math.random()<.25){
    bonus+=v;
    extraReveals.push({...p,value:v,name:'limit'});
    v*=2;
    j++;chains++;
   }
  }
  if(chains){
   gain+=bonus;
   addLog(log,'♾️ 限界突破 ×'+chains);
  }
 }

 if(has(57)&&d.ghost>0&&Math.random()<.25){
  gain+=d.ghost;
  addLog(log,'👻 ゴースト再来');
 }
 if(has(52)&&spin%20===0&&d.bestTurn>0){
  gain+=d.bestTurn;
  addLog(log,'⏳ タイムリープ');
 }
 if(has(33)&&LV(64)>0){
  gain+=15*LV(64)*(
   Math.pow(1+.1*LV(33),Math.floor(spin/10))-1
  );
  if(spin%10===0)addLog(log,'🏦 複利成長');
 }
 if(has(50)&&Math.random()<.01){
  multiplier*=100;
  addLog(log,'🌠 奇跡の1%！！');
 }

 let siphon=0;
 if(has(54)&&!realHit){
  siphon=Math.min(d.score,Math.max(1,Math.floor(d.score*.01)));
  d.blackhole+=siphon;
  if(siphon)addLog(log,'🕳️ '+fmt(siphon)+'点吸収');
 }
 if(has(54)&&full&&d.blackhole>0){
  gain+=10*d.blackhole;
  addLog(log,'🕳️ ブラックホール放出！');
  d.blackhole=0;
 }

 let award=safe(gain*multiplier);
 if(has(56)&&realHit&&award>0){
  let saved=Math.floor(award*.2);
  d.chest=safe(d.chest+saved);
  award-=saved;
  addLog(log,'🎁 宝箱に貯金');
 }

 if(realHit){
  d.streak++;
  d.misses=0;
  if(z.main===d.lastSym)d.sameSym++;
  else d.sameSym=1;
  d.lastSym=z.main;
  d.seen=[...new Set([
   ...d.seen,...z.payouts.map(p=>p.sym)
  ])];

  if(has(58)){
   for(const sym of new Set(z.payouts.map(p=>p.sym))){
    d.virus[sym]=Math.min(20,(d.virus[sym]||0)+.10);
    let other=rand(6);
    d.virus[other]=Math.min(20,(d.virus[other]||0)+.10);
   }
   addLog(log,'🦠 感染拡大');
  }
 }else{
  d.misses++;
  d.streak=0;
  d.sameSym=0;
  if(has(37))d.charge=Math.min(10,d.charge+1);
 }

 if(big)d.sinceBig=0;
 else d.sinceBig++;
 if(has(34))d.growing7+=z.count(5);

 d.ghost=realHit?highest:0;
 if(has(12)&&z.used.size){
  let a=[...z.used],i=a[rand(a.length)];
  d.sticky={i,v:g[i]};
 }else d.sticky=null;

 if(has(55)&&spin%5===0){
  d.prophecy=rand(6);
  d.prophecyEnd=spin+5;
  addLog(log,'🔮 次の5回：'+F[d.prophecy]);
 }

 return {
  award,siphon,realHit,used:z.used,
  maxLen:z.maxLen,log,base:z.base,
  reveals:[...z.payouts,...extraReveals]
 };
}

function finalChest(log){
 if(has(56)&&!d.chestOpened){

  d.score=safe(d.score+bonus);

 }
}

// 当たりを1ラインずつ表示
async function displayResult(res,g){
 const hits=res.reveals||[];
 const msg=$('message');

 cells.forEach((c,i)=>{
  c.textContent=sign(g[i]);
  c.classList.remove('rolling','land','hit','focus','seen');
 });

 if(hits.length){
  for(let i=0;i<hits.length;i++){
   const p=hits[i];

   cells.forEach(c=>{
    if(c.classList.contains('focus')){
     c.classList.remove('focus');
     c.classList.add('seen');
    }
   });

   p.idx.forEach(n=>{
    if(cells[n]){
     cells[n].classList.remove('seen');
     cells[n].classList.add('focus');
    }
   });

   msg.className='message '+(p.len>=4?'mega':'win');
   msg.textContent=`${i+1}/${hits.length}　${sign(p.sym)} ${p.len}連　基本 +${fmt(p.value)}`;

   smallCelebration(p,i+1,hits.length);

   // 大量当選でも1ラインずつ見せる
   await pause(
    hits.length>25?170:
    hits.length>9?340:HIT_INTERVAL
   );
  }
 }else{
  msg.className='message';
  msg.textContent='ハズレ…';
  beep(190,.14,'sine',.035);
  await pause(340);
 }

 cells.forEach((c,i)=>{
  c.classList.remove('focus','seen');
  if(res.used.has(i))c.classList.add('hit');
 });

 // 全ての当たり演出終了後にスコア加算
 d.spins++;
 d.score=safe(d.score-res.siphon);
 d.score=safe(d.score+res.award);
 d.best=Math.max(d.best,d.score);
 d.bestTurn=Math.max(d.bestTurn,res.award);
 d.grid=g.slice();
 d.events=res.log.slice(-9).reverse();

 msg.className='message';
 if(res.award>0){
  msg.textContent='合計 +'+fmt(res.award)+' 点！';
  msg.classList.add(
   res.maxLen>=4||res.award>=10000?'mega':'win'
  );
  if(res.award>=10000)song(true);
 }else if(hits.length){
  msg.textContent='ライン成立！ ただし配当は0点';
 }else{
  msg.textContent='ハズレ！ 次の回転へ';
 }

 save();
 render();
 await pause(700);
 busy=false;
 progress();
}

   ||!$('overlay').classList.contains('hidden'))return;

 busy=true;
 render();
 $('message').className='message';
 $('message').textContent='リール回転中…';

 cells.forEach(c=>{
  c.classList.remove('hit','focus','seen','land');
  c.classList.add('rolling');
 });

 beep(140,.2,'sawtooth',.06);
 vibrate(20);

 const spin=d.spins+1;
 const log=[];
 const selected=chooseGrid(spin,log);
 const g=selected.g;

 // 最終盤面を停止前に確定
 const result=getSpin(g,selected.god,spin,log);
 const stopped=[false,false,false,false,false];

 const timer=setInterval(()=>{
  for(let i=0;i<15;i++){
   if(!stopped[i%5]){
    cells[i].textContent=sign(pick());
   }
  }
 },65);

 for(let col=0;col<5;col++){

   stopped[col]=true;

   // 1列3マスを同時停止
   for(let row=0;row<3;row++){
    const i=row*5+col;
    cells[i].textContent=sign(g[i]);
    cells[i].classList.remove('rolling');
    cells[i].classList.add('land');
   }

   beep(175+col*58,.17,'triangle',.095);
   beep(85,.09,'sine',.09);
   vibrate([45,20,25]);

   $('message').textContent=`${col+1} / 5 列　停止！`;

   if(col===4){
    clearInterval(timer);
    $('message').textContent='当たりライン判定中…';

    setTimeout(()=>{
     displayResult(result,g).catch(e=>{
      console.error(e);
      busy=false;
      render();
     });
    },450);
   }
  },FIRST_STOP+col*COLUMN_INTERVAL);
 }
}

function close(){
 $('overlay').classList.add('hidden');
 render();
}
function modal(html){
 $('modal').innerHTML=html;
 $('overlay').classList.remove('hidden');
 render();
}

function choiceThree(){
 let available=ITEMS.filter(x=>LV(x[0])<x[5]);
 let choices=[];

 for(let slot=0;slot<3&&available.length;slot++){
  let r=rand(100),tier=0;
  while(tier<ODDS.length-1&&r>=ODDS[tier]){
   r-=ODDS[tier++];
  }

  let pool=available.filter(x=>x[4]===tier);
  if(!pool.length)pool=available;

  let got=pool[rand(pool.length)];
  choices.push(got);
  available=available.filter(x=>x!==got);
 }
 return choices;
}

function upgrade(){
 let choices=choiceThree();

 if(!choices.length){
  d.upgradeCount++;
  save();
  return progress();
 }

 modal(`
 <div class="eyebrow">UPGRADE UNLOCKED</div>
 <h2>⚡ 強化ノルマ達成！</h2>
 <p>累計 ${fmt(d.score)} 点！<br>好きな能力を1つ選んで次の回転へ</p>
 <div id="choices"></div>
 `);

 for(const x of choices){
  let b=document.createElement('button');
  b.className='choice';
  b.innerHTML=`
  <span class="emoji">${x[1]}</span>
  <span>
  <span class="tier tier-${x[4]}">${TIER[x[4]]}</span>
  <strong>${x[2]}</strong>
  <small>${x[3]} ${x[5]===1?'・所持1回限り':'・Lv '+(LV(x[0])+1)}</small>
  </span>
  `;

  b.onclick=()=>{
   d.powers[x[0]]=LV(x[0])+1;
   d.upgradeCount++;

   if(x[0]===43)d.contractAt=d.spins;
   if(x[0]===47){
    let cost=Math.floor(d.score*.2);
    d.score=safe(d.score-cost);
    d.heist++;
   }
   if(x[0]===55){
    d.prophecy=rand(6);
    d.prophecyEnd=d.spins+5;
   }

   d.events=[
    x[1]+' '+x[2]+'獲得',
    ...(d.events||[])
   ].slice(0,9);

   save();
   close();
   beep(880,.15,'triangle',.075);
   progress();
  };
  $('choices').appendChild(b);
 }
}

function progress(){
 if(busy)return;

 if(d.upgradeCount<80&&target(d.upgradeCount)<CAP
  &&d.score>=target(d.upgradeCount)){
  upgrade();
  return;
 }

 if(d.spins>=100){
  let log=[];
  finalChest(log);
  if(log.length){
   d.events=[...log,...d.events].slice(0,9);
  }
  save();
  results();
  return;
 }
 render();
}

function results(){
 let record=d.score>d.record;

 modal(`
 <div class="eyebrow">100 SPINS COMPLETE</div>
 <h2>${record?'🏆 NEW BEST!':'🎰 FINISH!'}</h2>
 <p>100回転終了！ おつかれ！</p>
 <div class="eyebrow">FINAL SCORE</div>
 <div class="score" style="color:var(--gold)">${fmt(d.score)}</div>
 <p>
 強化回数：${d.upgradeCount}回<br>
 獲得強化：${Object.keys(d.powers).length}種類<br>
 自己ベスト：${fmt(d.best)}点
 ${has(56)?'<br>🎁 最終宝箱：精算済み':''}
 </p>
 <button class="primary" id="again">もう一度100回転！</button>
 `);
 $('again').onclick=restart;
}

function restart(){
 let best=d.best;
 d=fresh();
 d.best=best;
 d.record=best;

 cells.forEach((c,i)=>{
  c.className='cell';
  c.textContent=sign(d.grid[i]);
 });

 $('message').textContent='SPINでスタート！';
 $('message').className='message';
 save();
 close();
}

$('spin').onclick=begin;
$('sound').onclick=()=>{
 muted=!muted;
 try{
  localStorage.setItem(SAVE+'_mute',muted?'1':'0');
 }catch(e){}
 render();
 if(!muted)beep(720);
};
$('reset').onclick=()=>{
 if(!busy&&confirm('100回転を最初からやり直す？ 最高記録は残るで。')){
  restart();
 }
};

render();
setTimeout(progress,110);
})();
</script>
</body>
