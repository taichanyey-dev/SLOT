function smallCelebration(p,count,total){
  // 当たりごとに別々の光・音・振動。5連は派手に。
  let big=p.len>=4||p.name==='limit';
  beep(470+Math.min(18,count)*65,.17,big?'sawtooth':'triangle',big?.085:.058);
  beep(710+Math.min(12,count)*47,.21,'sine',.055,.10);
  vibrate(big?[55,35,85]:[30,20,40]);
  if(big){$('flash').classList.add('on');setTimeout(()=>$('flash').classList.remove('on'),95);}
  let m=document.querySelector('.machine');
  let f=document.createElement('div');
  f.className='win-float';
  f.textContent=(p.name==='chain'?'CHAIN! ':p.name==='limit'?'LIMIT! ':p.len>=5?'JACKPOT! ':p.len===4?'BIG HIT! ':'HIT! ')+count+'/'+total;
  m.appendChild(f);
  if(p.len>=5){const a=document.createElement('div');a.className='win-float';a.style.cssText='font-size:60px;top:15%;color:#fff;animation-duration:.65s';a.textContent=sign(p.sym);m.appendChild(a);setTimeout(()=>a.remove(),700)}
  setTimeout(()=>f.remove(),540);
  if(p.len>=5||p.name==='limit'){
    // ジャックポットも一度に合算せずラインごとに演出
    for(let j=0;j<11;j++){
      let c=document.createElement('i');c.className='confetti';
      c.style.cssText=`--x:${Math.random()*100}vw;--dx:${rand(181)-90}px;--c:${['#bcff69','#ffda75','#ff67af','#7ce7ff'][j%4]};--t:${.7+Math.random()*.55}s;--d:0s`;
      document.body.append(c);setTimeout(()=>c.remove(),1400);
    }
  }
}

async function displayResult(res,g){

 }else{

 }

 cells.forEach((c,i)=>{c.classList.remove('focus','seen');if(res.used.has(i))c.classList.add('hit')});
 // Show base paylines first, then all bonuses, then the actual total multiplier.

}
function progress(){if(busy)return;if(d.spins>=100){let log=[];finalChest(log);if(log.length)d.events=[...log,...d.events].slice(0,9);save();results();return}if(d.upgradeCount<80&&target(d.upgradeCount)<CAP&&d.score>=target(d.upgradeCount)){upgrade();return}render()}
function results(){completeRun();let record=d.score>d.record;modal(`<div class="eyebrow">100 SPINS COMPLETE</div><h2>${record?'🏆 NEW BEST!':'🎰 FINISH!'}</h2><p>100回転終了！ おつかれ！</p><div class="eyebrow">FINAL SCORE</div><div class="score" style="color:var(--gold)">${fmt(d.score)}</div><p>強化回数：${d.upgradeCount}回<br>獲得強化：${Object.keys(d.powers).length}種類<br>自己ベスト：${fmt(d.best)}点<br>最高当たり：${fmt(d.highestHit)}点<br>ビルド：${getBuild()}<br>シード：${d.seed}${has(56)?'<br>🎁 最終宝箱：精算済み':''}</p>${chartSVG(d.trace)}<button class="primary" id="again">もう一度100回転！</button>`);$('again').onclick=()=>restart()}
function restart(userSeed){let best=d.best;d=fresh();d.best=best;d.record=best;d.seed=userSeed||String(Date.now());d.rng=seedFromString(d.seed);cells.forEach((c,i)=>{c.className='cell';c.textContent=sign(d.grid[i])});$('message').textContent='SPINでスタート！';$('message').className='message';save();close();startTrait()}
$('codex').onclick=showCodex;$('history').onclick=showHistory;$('seed').onclick=askSeed;$('speed').onclick=()=>{speedIndex=(speedIndex+1)%3;try{localStorage.setItem(SAVE+'_speed',String(speedIndex))}catch(e){}render()};$('spin').onclick=begin;$('sound').onclick=()=>{muted=!muted;try{localStorage.setItem(SAVE+'_mute',muted?'1':'0')}catch(e){}render();if(!muted)beep(720)};$('reset').onclick=()=>{if(!busy&&confirm('100回転を最初からやり直す？ 最高記録は残るで。'))restart()};
if(!d.seed){d.seed=String(Date.now());d.rng=seedFromString(d.seed);save()}render();setTimeout(()=>{if(!d.trait&&d.spins===0)startTrait();else progress()},110);
})();
</script></body></html>
