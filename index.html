
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050509">
<title>OVERDRIVE SLOT</title>
<style>
*{box-sizing:border-box}
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#fff;background:#050509}
html,body{margin:0;width:100%;min-height:100%;overflow:hidden}
body{min-height:100dvh;display:grid;place-items:center;touch-action:manipulation;-webkit-tap-highlight-color:transparent;background:radial-gradient(ellipse at 50% 42%,#26132d 0%,#100d1d 33%,#050509 80%)}
body::before{content:"";position:fixed;inset:-25%;background:conic-gradient(from 0deg,#6a14391f,transparent 22%,#4b3cff25 45%,transparent 67%,#ff830a21);filter:blur(75px);animation:ambient 12s linear infinite;pointer-events:none}
@keyframes ambient{to{transform:rotate(360deg)}}
#canvas,#whiteout,#rays,#vignette{position:fixed;inset:0;pointer-events:none}
#canvas{z-index:8;width:100%;height:100%}
#vignette{z-index:1;box-shadow:inset 0 0 110px #0009}
#rays{z-index:2;opacity:0;transform:scale(.5);background:repeating-conic-gradient(from 0deg at 50% 48%,#ffc22c00 0deg,#ffd75970 6deg,#ffe27c00 11deg,#0000 19deg);mix-blend-mode:screen;transition:opacity .23s;animation:raySpin 7s linear infinite}
@keyframes raySpin{to{transform:scale(1.4) rotate(360deg)}}
body.jackpot #rays{opacity:.9}
body.regwin #rays{opacity:.44;filter:hue-rotate(155deg)}
#whiteout{z-index:11;opacity:0;background:#fff}
#whiteout.flash{animation:tripleFlash 1.2s linear both}
@keyframes tripleFlash{0%,12%,33%,45%,66%,78%,100%{opacity:0}5%,38%,71%{opacity:.75}}
#game{position:relative;z-index:4;width:min(92vw,465px)}
#reels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.digit{position:relative;display:grid;place-items:center;overflow:hidden;height:clamp(112px,30vw,145px);border:1px solid #848092;border-radius:16px;background:linear-gradient(150deg,#262331,#0c0d15 55%,#201b2c);font-size:clamp(72px,21vw,108px);font-weight:1000;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 5px 3px #000b,0 0 18px #fff3;box-shadow:inset 0 3px 5px #ffffff29,inset 0 -16px 20px #0008,0 13px 22px #0009;will-change:transform}
.digit::after{content:"";position:absolute;inset:0;background:linear-gradient(#fff2,transparent 27%,transparent 74%,#000a);pointer-events:none}
body.running .digit:not(.stopped){filter:blur(.8px);text-shadow:0 -13px 10px #fff8,0 13px 10px #b25dff8c}
.digit.stopped{animation:clack .24s ease-out}
@keyframes clack{0%{transform:translateY(-13px) scaleY(1.15);filter:brightness(4)}60%{transform:translateY(5px) scaleY(.95)}100%{transform:none;filter:none}}
button{width:100%;height:76px;margin-top:27px;display:block;border:1px solid #fff8;border-radius:15px;background:linear-gradient(150deg,#fff,#cecad9);font-family:inherit;font-size:25px;font-weight:900;color:#11101a;box-shadow:0 8px 0 #777282,0 20px 28px #000a;cursor:pointer;transition:transform .13s,box-shadow .13s}
button:active:not(:disabled){transform:translateY(6px);box-shadow:0 2px 0 #777282,0 8px 16px #000a}
button:disabled{opacity:.75;cursor:default}
body.reach #game{filter:drop-shadow(0 0 40px #fa406755)}
body.reach .digit:nth-child(3){border-color:#ffe383;box-shadow:0 0 36px #fbbf24a8,inset 0 0 25px #ff910055;animation:pulse .45s ease-in-out infinite alternate}
@keyframes pulse{to{filter:brightness(1.7);transform:scale(1.055)}}
body.jackpot{background:radial-gradient(ellipse at 50% 42%,#8d3a05 0%,#3b101d 43%,#080307 85%)}
body.jackpot .digit{color:#fff2ab;border:2px solid #fff3a4;text-shadow:0 0 20px #ffffb0,0 0 46px #ff9300,0 4px 2px #a33d00;box-shadow:0 0 30px #ffe04db0,0 0 85px #ff5900a0,inset 0 0 32px #ffc40083;animation:gold 1.2s ease-in-out infinite alternate}
@keyframes gold{to{filter:brightness(1.7);box-shadow:0 0 55px #fff0ad,0 0 130px #ff5400,inset 0 0 35px #fbbf24}}
body.regwin .digit{color:#c5efff;border:2px solid #a7f3ff;box-shadow:0 0 35px #22d3eeaf,0 0 70px #6366f199,inset 0 0 20px #06b6d477}
body.smallwin .digit{border-color:#42ffe2;box-shadow:0 0 26px #00d4b660,inset 0 0 17px #17ffff33}
body.impact #game{animation:shake .55s ease-out}
@keyframes shake{0%,100%{transform:none}10%{transform:translate(-13px,8px) rotate(-1.5deg)}25%{transform:translate(14px,-10px) rotate(1.4deg)}40%{transform:translate(-12px,-5px)}55%{transform:translate(10px,9px)}70%{transform:translate(-6px,2px)}85%{transform:translate(4px,-3px)}}
#words{position:fixed;inset:0;z-index:10;display:grid;place-items:center;pointer-events:none;opacity:0;visibility:hidden;text-align:center}
#words strong{display:block;font-size:clamp(40px,12vw,87px);font-weight:1000;line-height:.94;letter-spacing:-.06em;font-style:italic;white-space:nowrap;color:#fff0a1;-webkit-text-stroke:1px #fff;text-shadow:0 4px #9f3300,0 8px #481600,0 0 38px #ffbd00;filter:drop-shadow(0 0 25px #f50)}
#words em{display:block;font-size:clamp(15px,4vw,26px);font-weight:900;font-style:normal;letter-spacing:.27em;margin-top:19px;text-shadow:0 0 20px #fff}
#words.show{visibility:visible;animation:wordPop 2.5s ease-out forwards}
#words.blue strong{color:#c5f5ff;text-shadow:0 4px #1a4ab7,0 8px #13115c,0 0 30px #00d9ff;filter:drop-shadow(0 0 18px #00aaff)}
#words.warn strong{color:#fff;text-shadow:0 4px #d51a4d,0 0 35px #ff003c;font-size:clamp(35px,10vw,72px)}
@keyframes wordPop{0%{opacity:0;transform:scale(.25) rotate(-9deg)}12%{opacity:1;transform:scale(1.19) rotate(3deg)}22%{transform:scale(.95)}36%,66%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.55)}}
@media(prefers-reduced-motion:reduce){body::before,#rays,.digit,body.reach .digit:nth-child(3),body.impact #game{animation:none!important}#whiteout.flash{animation:none}#words.show{animation:none;opacity:1}}
</style>
</head>
<body>
<div id="rays"></div><div id="vignette"></div><canvas id="canvas"></canvas><div id="whiteout"></div>
<div id="words" aria-live="polite"><div><strong></strong><em></em></div></div>
<main id="game"><div id="reels"><div class="digit">0</div><div class="digit">0</div><div class="digit">0</div></div><button id="spin">回す</button></main>
<script>
'use strict';
// 内部抽選の確率はAタイプ風の仮設定。特定の実機と同じではありません。
const roles=[
 {name:'BIG',odds:287,out:'777'},
 {name:'REG',odds:431,out:'333'},
 {name:'REPLAY',odds:7.3,out:'222'},
 {name:'BELL',odds:6.2,out:'555'},
 {name:'CHERRY',odds:33,out:'111'}
];
const $=s=>document.querySelector(s);
const digits=[...document.querySelectorAll('.digit')],button=$('#spin'),flash=$('#whiteout'),words=$('#words');
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
let busy=false,run=0,tickTimer=null;
const rnd=()=>Math.random();
function draw(){
 const u=new Uint32Array(1);
 const x=(globalThis.crypto?.getRandomValues?(globalThis.crypto.getRandomValues(u),u[0]/4294967296):rnd());
 let left=x;
 for(const r of roles){left-=1/r.odds;if(left<0)return r}
 let out;
 if(rnd()<.13){out='77'+Math.floor(rnd()*9)}
 else{do{out=''+Math.floor(rnd()*10)+Math.floor(rnd()*10)+Math.floor(rnd()*10)}while(out[0]===out[1]&&out[1]===out[2])}
 return{name:'MISS',out};
}
// 外部MP3なし。波形合成、轟音、重低音、警告サイレン、メロディを端末で生成する。
const A={ctx:null,bus:null,noiseBuffer:null,motor:null,motorVol:null,
 start(){
  try{
   if(!this.ctx){
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    const c=this.ctx=new AC();this.bus=c.createDynamicsCompressor();
    this.bus.threshold.value=-18;this.bus.knee.value=18;this.bus.ratio.value=7;this.bus.attack.value=.004;this.bus.release.value=.16;
    const volume=c.createGain();volume.gain.value=.86;this.bus.connect(volume);volume.connect(c.destination);
    const b=this.noiseBuffer=c.createBuffer(1,c.sampleRate,c.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=rnd()*2-1;
   }
   if(this.ctx.state==='suspended')this.ctx.resume().catch(()=>{});
  }catch(e){this.ctx=null}
 },
 tone(f,d=.2,type='sawtooth',v=.22,at=0,to=f){
  if(!this.ctx)return;
  const c=this.ctx,t=c.currentTime+at,o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(Math.max(1,f),t);o.frequency.exponentialRampToValueAtTime(Math.max(1,to),t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,v),t+.008);
  g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(this.bus);o.start(t);o.stop(t+d+.03);
 },
 noise(d=.2,v=.2,cut=2800,at=0){
  if(!this.ctx||!this.noiseBuffer)return;
  const c=this.ctx,t=c.currentTime+at,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
  s.buffer=this.noiseBuffer;f.type='lowpass';f.frequency.value=cut;
  g.gain.setValueAtTime(Math.max(.0002,v),t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(f);f.connect(g);g.connect(this.bus);s.start(t);s.stop(t+d+.01);
 },
 kick(t=0){this.tone(155,.47,'sine',.8,t,35);this.noise(.16,.42,1700,t)},
 bell(f,at=0){this.tone(f,.48,'sine',.19,at);this.tone(f*2.01,.24,'triangle',.11,at)},
 press(){this.kick();this.tone(650,.12,'square',.12,0,150)},
 motorOn(){if(!this.ctx)return;const c=this.ctx,t=c.currentTime,o=c.createOscillator(),g=c.createGain();
  o.type='sawtooth';o.frequency.setValueAtTime(46,t);o.frequency.linearRampToValueAtTime(85,t+.3);
  g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(.08,t+.22);
  o.connect(g);g.connect(this.bus);o.start(t);this.motor=o;this.motorVol=g;
 },
 motorOff(){if(!this.ctx||!this.motor)return;let t=this.ctx.currentTime;
  try{this.motorVol.gain.cancelScheduledValues(t);this.motorVol.gain.setValueAtTime(.08,t);this.motorVol.gain.exponentialRampToValueAtTime(.0001,t+.18);this.motor.stop(t+.19)}catch(e){}
  this.motor=null;
 },
 spinTick(){this.tone(370,.035,'square',.05,0,230)},
 stop(i){this.kick();this.tone(700+i*120,.15,'square',.15,0,110);this.noise(.11,.34,1800)},
 warning(){
  this.kick();this.tone(540,.33,'sawtooth',.28,0,950);this.tone(950,.36,'sawtooth',.23,.31,480);
  [0,.38,.76,1.14].forEach(t=>{this.tone(86,.27,'sine',.54,t,42);this.noise(.09,.15,900,t)});
  for(let i=0;i<8;i++)this.tone(750+i*90,.09,'square',.10,.11+i*.16,900+i*110);
 },
 jackpot(){
  this.motorOff();this.kick();this.kick(.23);this.kick(.47);
  this.noise(.95,.9,9000);this.noise(.65,.65,2600,.4);
  this.tone(125,1,'sawtooth',.6,0,36);this.tone(53,1.5,'sine',.9,0,27);
  for(let i=0;i<12;i++){this.tone(380+i*120,.10,'sawtooth',.13,.06+i*.055,900+i*130)}
  const melody=[523,659,784,1047,1319,1047,1568,1319,2093,2637];
  melody.forEach((f,i)=>{let t=.65+i*.145;this.bell(f,t);this.tone(f/2,.19,'sawtooth',.12,t)});
  [1.08,1.45,1.84,2.22].forEach(t=>{this.kick(t);this.noise(.24,.3,6000,t)});
  this.tone(1047,1.4,'triangle',.31,2.3,2093);this.tone(523,1.4,'sawtooth',.17,2.3,1047);
 },
 reg(){this.motorOff();this.kick();this.noise(.42,.53,5000);
  [392,494,587,784,988,1175].forEach((f,i)=>this.bell(f,.2+i*.16));this.tone(120,.68,'sawtooth',.35,0,55);
 },
 small(name){this.motorOff();this.kick();
  const notes=name==='BELL'?[784,988,1319,1568]:name==='REPLAY'?[587,740,880]:[440,660,880];
  notes.forEach((f,i)=>this.bell(f,i*.09));
 },
 lose(suspense){this.motorOff();if(suspense){this.tone(460,.19,'triangle',.15,0,230);this.tone(230,.3,'triangle',.14,.13,100)}}
};
// 全画面: 火花＋紙吹雪＋衝撃波＋レーザー
const cv=$('#canvas'),ctx=cv.getContext('2d');
let particles=[],rings=[],lasers=[],animating=false;
function size(){const d=Math.min(devicePixelRatio||1,2);cv.width=Math.round(innerWidth*d);cv.height=Math.round(innerHeight*d);ctx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',size);size();
const paletteGold=['#ffffff','#fff5a4','#ffbd00','#ff6a00','#ff2965'];
const paletteBlue=['#ffffff','#a2faff','#32c7ff','#5472ff','#b85cff'];
function effects(colors,n=140){
 const cx=innerWidth/2,cy=innerHeight*.43;if(reduceMotion)n=Math.min(n,14);
 for(let i=0;i<n;i++){const a=rnd()*Math.PI*2,v=2+rnd()*13;
  particles.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,life:42+rnd()*70,angle:rnd()*6.3,
   color:colors[Math.floor(rnd()*colors.length)],size:1+rnd()*5,shape:i%3});
 }
 if(!reduceMotion){for(let i=0;i<3;i++)rings.push({x:cx,y:cy,r:15-i*60,alpha:1,color:colors[i%colors.length]});
  for(let i=0;i<14;i++)lasers.push({angle:i*Math.PI/7+rnd()*.1,life:22+rnd()*24,color:colors[i%colors.length]});}
 if(!animating){animating=true;requestAnimationFrame(paint)}
}
function paint(){ctx.clearRect(0,0,innerWidth,innerHeight);
 for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vx*=.992;p.vy+=.16;p.life--;
  ctx.globalAlpha=Math.min(1,p.life/25);ctx.fillStyle=p.color;ctx.save();ctx.translate(p.x,p.y);
  ctx.rotate(p.angle+=.09);ctx.fillRect(-p.size/2,-p.size/2,p.size,p.shape===0?p.size*3:p.size);ctx.restore()}
 particles=particles.filter(p=>p.life>0);
 for(const r of rings){r.r+=21;r.alpha-=.027;ctx.beginPath();ctx.arc(r.x,r.y,Math.max(1,r.r),0,Math.PI*2);ctx.strokeStyle=r.color;ctx.globalAlpha=Math.max(0,r.alpha);ctx.lineWidth=7;ctx.stroke()}
 rings=rings.filter(r=>r.alpha>0);
 for(const l of lasers){l.life--;ctx.globalAlpha=Math.min(.7,l.life/28);ctx.beginPath();
  ctx.moveTo(innerWidth/2,innerHeight*.43);ctx.lineTo(innerWidth/2+Math.cos(l.angle)*innerWidth*1.6,innerHeight*.43+Math.sin(l.angle)*innerHeight*1.6);
  ctx.strokeStyle=l.color;ctx.lineWidth=3;ctx.stroke()}
 lasers=lasers.filter(l=>l.life>0);ctx.globalAlpha=1;
 if(particles.length||rings.length||lasers.length)requestAnimationFrame(paint);
 else{animating=false;ctx.clearRect(0,0,innerWidth,innerHeight)}
}
function caption(title,sub='',theme=''){
 words.className='';words.querySelector('strong').textContent=title;words.querySelector('em').textContent=sub;
 if(theme)words.classList.add(theme);void words.offsetWidth;words.classList.add('show');
}
function whiteFlash(){if(reduceMotion)return;flash.classList.remove('flash');void flash.offsetWidth;flash.classList.add('flash')}
function vibrate(v){try{navigator.vibrate?.(v)}catch(e){}}
function startState(){document.body.className='running';words.className='';flash.className='';particles=[];rings=[];lasers=[];digits.forEach(d=>d.classList.remove('stopped'))}
function finish(r,token,reach){
 clearInterval(tickTimer);tickTimer=null;A.motorOff();
 const b=document.body;b.className='';
 if(r.name==='BIG'){
  b.className='jackpot impact';whiteFlash();caption('777 JACKPOT','BIG BONUS');A.jackpot();
  effects(paletteGold,200);vibrate([130,40,180,60,280]);
  setTimeout(()=>{if(token===run)effects(paletteGold,160)},510);
  setTimeout(()=>{if(token===run)effects(paletteGold,130)},1160);
 }else if(r.name==='REG'){
  b.className='regwin impact';whiteFlash();caption('REG BONUS','BONUS GET','blue');A.reg();effects(paletteBlue,140);vibrate([90,50,120]);
 }else if(r.name!=='MISS'){
  b.className='smallwin';A.small(r.name);effects(r.name==='BELL'?paletteGold:paletteBlue,65);vibrate(45);
 }else{A.lose(reach);if(reach){effects(paletteBlue,16)}}
 const delay=r.name==='BIG'?2600:r.name==='REG'?1700:350;
 setTimeout(()=>{if(token!==run)return;busy=false;button.disabled=false;button.textContent='回す'},delay);
}
button.addEventListener('click',()=>{
 if(busy)return;busy=true;const token=++run;A.start();A.press();A.motorOn();startState();
 button.disabled=true;button.textContent='回転中…';
 const r=draw(),reach=r.out.slice(0,2)==='77';
 const stops=reach?[770,1370,3370]:[690,1150,1680],done=[false,false,false],last=[0,0,0];
 let warning=false;tickTimer=setInterval(()=>A.spinTick(),125);
 const start=performance.now();
 function frame(now){
  if(token!==run)return;
  const elapsed=now-start;
  for(let i=0;i<3;i++){
   if(!done[i]&&elapsed>=stops[i]){
    done[i]=true;digits[i].textContent=r.out[i];digits[i].classList.add('stopped');
    A.stop(i);vibrate(25);
    if(i===1&&reach&&!warning){warning=true;document.body.className='running reach';A.warning();caption('激アツ','LAST REEL','warn');vibrate([70,60,90])}
   }else if(!done[i]&&now-last[i]>(reduceMotion?140:37)){
    digits[i].textContent=Math.floor(rnd()*10);last[i]=now;
   }
  }
  if(done.every(Boolean))finish(r,token,reach);else requestAnimationFrame(frame);
 }
 requestAnimationFrame(frame);
});
</script>
</body>
</html>
